<!DOCTYPE html><html lang="id"><head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"> <meta name="theme-color" content="#0f172a"> <link rel="manifest" href="manifest.json"> <title>PORTO</title> <style> :root { --bg: #0f172a; --card: #1e293b; --accent: #38bdf8; --text: #f8fafc; --subtext: #94a3b8; --up: #4ade80; --down: #f87171; --gray-btn: #334155; --red-muted: #991b1b; } \* { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }  html, body { background: var(--bg); color: var(--text); margin: 0; padding: 0; min-height: 100%; } .container { width: 100%; max-width: 420px; margin: 0 auto; display: flex; flex-direction: column; position: relative; }
 .top-flow { padding: 15px 15px 5px 15px; background: var(--bg); } .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; } .brand { font-size: 18px; font-weight: bold; color: var(--accent); } .kurs-info { font-size: 9px; color: var(--subtext); background: rgba(255,255,255,0.05); padding: 3px 6px; border-radius: 8px; border: 1px solid #334155; }  .sticky-header { position: sticky; top: 0; z-index: 100; background: var(--bg); padding: 5px 15px 10px 15px; } .summary-card { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); border-radius: 12px; padding: 12px; margin-bottom: 10px; border: 1px solid var(--accent); text-align: center; } .summary-idr { font-size: 20px; font-weight: 800; display: block; } #total-all-usd { color: var(--subtext); font-size: 12px; }
 .tab-container { display: flex; gap: 8px; margin-bottom: 10px; background: rgba(255,255,255,0.05); padding: 4px; border-radius: 10px; border: 1px solid #334155; } .tab-btn { flex: 1; padding: 8px; border-radius: 6px; border: none; background: transparent; color: var(--subtext); cursor: pointer; font-weight: bold; font-size: 12px; transition: 0.3s; } .tab-btn.active { background: var(--accent); color: #0f172a; }  .filter-input { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid #334155; border-radius: 10px; padding: 10px 12px; color: white; outline: none; font-size: 13px; margin-bottom: 8px; }  .control-row { display: flex; justify-content: space-between; gap: 6px; margin-bottom: 5px; } .control-select { background: var(--card); color: white; border: 1px solid #334155; border-radius: 6px; font-size: 10px; padding: 6px; outline: none; cursor: pointer; flex: 1; }
 #main-list { padding: 5px 10px 20px 10px; min-height: 60vh; }
 .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 2000; display: none; align-items: center; justify-content: center; padding: 20px; } .modal-content { width: 100%; max-width: 340px; background: var(--card); border: 1px solid var(--accent); border-radius: 15px; padding: 20px; transform: scale(0.9); transition: transform 0.2s; } .modal-overlay.active { display: flex; } .modal-overlay.active .modal-content { transform: scale(1); }  @media screen and (max-height: 550px) { .modal-content { transform: translateY(-20%) scale(1) !important; } }
 .modal-title { font-weight: bold; font-size: 14px; text-align: center; margin-bottom: 15px; color: var(--text); text-transform: uppercase; } .modal-input { width: 100%; background: #000; border: 1px solid var(--accent); color: #fff; padding: 12px; border-radius: 8px; margin-bottom: 15px; outline: none; font-size: 14px; text-align: center; } .modal-btns { display: flex; gap: 8px; justify-content: center; } .modal-btn { flex: 1; padding: 12px 5px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 11px; text-transform: uppercase; }  .btn-delete { background: var(--red-muted); color: white; } .btn-edit { background: var(--gray-btn); color: var(--accent); } .btn-ok { background: var(--accent); color: #0f172a; } .btn-cancel { background: #334155; color: #b0b0b0; }
 .coin-row { margin-bottom: 8px; } .coin-card { background: var(--card); border-radius: 12px; padding: 10px; display: flex; align-items: center; cursor: pointer; border: 1px solid transparent; transition: 0.2s; -webkit-user-select: none; user-select: none; } .coin-card:active { background: #2d3a4f; border-color: var(--accent); }  .logo-wrapper { width: 34px; height: 34px; margin-right: 12px; border-radius: 50%; border: 1px solid #334155; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; color: var(--accent); background: rgba(255,255,255,0.03); flex-shrink: 0; overflow: hidden; } .logo-wrapper img { width: 100%; height: 100%; object-fit: cover; } .logo-initial { text-transform: uppercase; }
 .info-group { flex-grow: 1; line-height: 1.3; } .symbol { font-weight: 800; font-size: 16px; color: #fff; } .change-pct { font-size: 10px; margin-left: 5px; font-weight: bold; padding: 1px 4px; border-radius: 4px; } .change-pct.up { color: #fff; background: rgba(74,222,128,0.2); } .change-pct.down { color: #fff; background: rgba(248,113,113,0.2); }
 .details { display: none; padding: 10px; background: rgba(255,255,255,0.02); border-radius: 0 0 12px 12px; border: 1px solid #334155; border-top: none; margin-top: -5px; } .source-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid #2d3a4f; } .source-row:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; } .source-label { font-size: 12px; color: var(--subtext); flex: 1; display: flex; align-items: center; gap: 5px; font-weight: 500;} .input-wrapper { display: flex; gap: 5px; flex: 2; } .source-input { width: 50%; background: #000; border: 1px solid #334155; color: #fff; padding: 8px; border-radius: 6px; font-size: 12px; outline: none; text-align: center; } .source-input:focus { border-color: var(--accent); } .del-src { color: var(--down); cursor: pointer; font-size: 18px; font-weight: bold; padding: 0 5px; } .del-src:hover { transform: scale(1.2); }  .new-source-box { display: flex; gap: 6px; margin-top: 10px; } .new-source-input { flex: 2; background: #000; border: 1px solid #334155; color: white; border-radius: 6px; padding: 8px; font-size: 12px; outline: none; } .new-source-btn { flex: 1; background: var(--gray-btn); color: var(--accent); border: none; border-radius: 6px; font-weight: bold; cursor: pointer; } .new-source-btn:active { background: #4a5568; }  .global-add { position: sticky; bottom: 15px; margin: 0 15px; display: flex; gap: 8px; background: var(--bg); padding: 5px; border-radius: 12px; z-index: 10; border: 1px solid #334155; } .global-add input { flex: 3; background: #000; border: 1px solid #334155; color: white; border-radius: 8px; padding: 12px; outline: none; font-size: 14px; } .global-add button { flex: 1; background: var(--accent); color: #0f172a; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; } .toast { position: fixed; bottom: 85px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--accent); color: #0f172a; padding: 10px 20px; border-radius: 20px; font-weight: bold; font-size: 12px; opacity: 0; transition: 0.3s; z-index: 5000; pointer-events: none; } .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); } </style> </head><body> <div class="container"> <div class="top-flow"> <div class="header"> <span class="brand">PORTO</span> <span class="kurs-info">USD/IDR <span id="usd-rate">-</span></span> </div> </div> <div class="sticky-header"> <div class="summary-card" onclick="toggleCurrencyView()"> <span class="summary-idr" id="total-all-idr">Rp 0</span> <span id="total-all-usd">$0.00</span> </div> <div class="tab-container"> <button class="tab-btn active" onclick="switchTab('coin')">COIN</button> <button class="tab-btn" onclick="switchTab('exchange')">EXCHANGE</button> </div> <input type="text" id="filter-input" class="filter-input" placeholder="Cari..." oninput="renderList()"> <div class="control-row"> <select id="sort-order" class="control-select" onchange="renderList()"> <option value="name">Urut Nama</option> <option value="value">Urut Nilai</option> <option value="gainers">Gainer/Loser</option> </select> </div> </div> <div id="main-list"> </div> <div class="global-add"> <input type="text" id="global-add-input" placeholder="Tambah Koin/Exch..." onkeypress="if(event.key==='Enter') handleGlobalAdd()"> <button onclick="handleGlobalAdd()">+</button> </div> <div id="modal-overlay" class="modal-overlay" onclick="closeModal()"> <div class="modal-content" onclick="event.stopPropagation()"> <div id="modal-title" class="modal-title"></div> <input type="text" id="modal-input" class="modal-input" style="display:none"> <div id="modal-btns" class="modal-btns"> </div> </div> </div> <div id="toast" class="toast">Notifikasi</div> </div> <script> let watchlist = JSON.parse(localStorage.getItem('my_assets_v2')) || ['BTC','ETH','USDT','IDR']; let balances = JSON.parse(localStorage.getItem('my_balances_v2')) || {}; let coinSources = JSON.parse(localStorage.getItem('my_coin_sources')) || {}; let allExchanges = JSON.parse(localStorage.getItem('my_exchanges_v2')) || ['Spot']; let currentTab = 'coin'; let currencyView = localStorage.getItem('my_currency_v') || 'USD'; let prices = { 'USDT': 1, 'IDR': 0 }; let changes = {}; let usdToIdr = 16300; let expandedItem = null; let holdTimer = null; const exchangeLogos = { 'Spot': 'any', 'Wallet': 'any', 'Pintu': 'https://id.pintu.co.id/icon.png', 'Tokocrypto': 'https://jurnal.tokocrypto.com/wp-content/uploads/2021/04/Logo-Baru-Tokocrypto_T-Only.png', 'Bybit': 'https://app.coinalyze.net/img/exchange-logo/bybit.png', 'Binance': 'https://altcoinsbox.com/wp-content/uploads/2023/04/binance-logo.png', 'Indodax': 'https://th.bing.com/th/id/OIP.oA7b66v66O77H7_n_k_0_gHaHa?rs=1&pid=ImgDetMain', 'Trezor': 'https://wiki.trezor.io/images/Trezor_logo_icon.png', 'Metamask': 'https://pluspng.com/img-png/metamask-logo-png-metamask-is-a-browser-extension-and-it-is-not-designed-for-safari-but-it-is-available-for-chrome-firefox-opera-and-brave-get-it-on-chrome-webstore-512.png', 'Ledger': 'https://cryptowisser.com/media/exchange/ledger-wallets-logo.png' }; 
 function switchTab(tab) { if(currentTab===tab)return; currentTab=tab; document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active')); event.target.classList.add('active'); renderList(); updatePricesOnly(); } 
 function showToast(msg) { const toast = document.getElementById('toast'); toast.innerText = msg; toast.classList.add('show'); setTimeout(()=>toast.classList.remove('show'), 2500); } 
 function handleGlobalAdd() { const input = document.getElementById('global-add-input'); const v = input.value.trim().toUpperCase(); if(!v) return; if(currentTab === 'exchange') { if(!allExchanges.includes(v)) { allExchanges.push(v); saveAll(); input.value = ""; renderList(); } else showToast(`Exchange ${v} sudah ada!`); } else { if(!watchlist.includes(v)) { watchlist.push(v); coinSources[v] = []; saveAll(); input.value = ""; fetchAll(); } else showToast(`Koin ${v} sudah ada!`); } } 
 function toggleCurrencyView() { currencyView = (currencyView === 'IDR' ? 'USD' : 'IDR'); localStorage.setItem('my_currency_v', currencyView); updatePricesOnly(); } 
 function updateBal(s, src, type, v) { if(!balances[s]) balances[s]={}; if(!balances[s][src] || typeof balances[s][src] !== 'object') balances[s][src] = {amount:0, staking:''}; balances[s][src][type] = v; saveAll(); updatePricesOnly(); } 
 function saveAll() { localStorage.setItem('my_assets_v2', JSON.stringify(watchlist)); localStorage.setItem('my_balances_v2', JSON.stringify(balances)); localStorage.setItem('my_coin_sources', JSON.stringify(coinSources)); localStorage.setItem('my_exchanges_v2', JSON.stringify(allExchanges)); } 
 function getCoinTotal(sym) { if(!balances[sym]) return 0; return Object.values(balances[sym]).reduce((acc, curr) => acc + (parseFloat(curr.amount||0) + parseFloat(curr.staking||0)), 0); } 
 function updatePricesOnly() { let totalAllUsd = 0; if (currentTab === 'exchange') { allExchanges.forEach(ex => { let exTotalUsd = 0; watchlist.forEach(sym => { if(coinSources[sym]?.includes(ex)) { const d = balances[sym]?.[ex]; let b = (typeof d === 'object') ? (parseFloat(d.amount||0) + parseFloat(d.staking||0)) : parseFloat(d||0); exTotalUsd += (b * (prices[sym] || 0)); } }); totalAllUsd += exTotalUsd; const el = document.getElementById(`val-ex-${ex}`); if (el) el.innerText = (currencyView === 'IDR') ? `Rp ${(exTotalUsd * usdToIdr).toLocaleString('id-ID', {maximumFractionDigits:0})}` : `$${exTotalUsd.toLocaleString(undefined, {minimumFractionDigits: 2})}`; }); } else { watchlist.forEach(sym => { const valUsd = getCoinTotal(sym) * (prices[sym] || 0); totalAllUsd += valUsd; const elVal = document.getElementById(`val-coin-${sym}`); const elPrice = document.getElementById(`price-coin-${sym}`); const elChange = document.getElementById(`change-coin-${sym}`); if (elVal) elVal.innerText = (currencyView === 'IDR') ? `Rp ${(valUsd * usdToIdr).toLocaleString('id-ID', {maximumFractionDigits:0})}` : `$${valUsd.toLocaleString(undefined, {minimumFractionDigits: 2})}`; if (elPrice) elPrice.innerText = (sym === 'IDR' || sym === 'USDT') ? 'Stable Coin' : '$' + (prices[sym]||0).toLocaleString(undefined, {minimumFractionDigits: (prices[sym]||0) < 1 ? 4 : 2}); if (elChange) { const c = changes[sym] || "0.00"; elChange.innerText = `${parseFloat(c) >= 0 ? '+' : ''}${c}%`; elChange.className = `change-pct ${parseFloat(c) >= 0 ? 'up' : 'down'}`; } }); } document.getElementById('total-all-idr').innerText = `Rp ${Math.round(totalAllUsd*usdToIdr).toLocaleString('id-ID')}`; document.getElementById('total-all-usd').innerText = `$${totalAllUsd.toLocaleString(undefined, {minimumFractionDigits: 2})}`; } 
 function toggleDetail(id) { const target = document.getElementById(`det-${id}`); if (!target) return; if (expandedItem && expandedItem !== id) { const oldEl = document.getElementById(`det-${expandedItem}`); if (oldEl) oldEl.style.display = 'none'; } if (target.style.display === 'block') { target.style.display = 'none'; expandedItem = null; } else { target.style.display = 'block'; expandedItem = id; } } 
 function addCoinToExchange(ex) { const input = document.getElementById(`add-coin-to-${ex}`); const s = input.value.toUpperCase().trim(); if(s) { if(!watchlist.includes(s)) { watchlist.push(s); coinSources[s]=[]; } if(!coinSources[s].includes(ex)) { coinSources[s].push(ex); saveAll(); input.value=""; renderList(); fetchPrices(); } else showToast("Koin sudah ada!"); } } 
 function addCustomSource(s) { const input = document.getElementById(`new-src-input-${s}`); const v = input.value.trim().toUpperCase(); if(v) { if(!coinSources[s].includes(v)) { coinSources[s].push(v); if(!allExchanges.includes(v)) allExchanges.push(v); saveAll(); renderList(); } else showToast("Source sudah ada!"); } } 
 function removeCoinFromExchange(s, ex) { coinSources[s] = coinSources[s].filter(i => i !== ex); saveAll(); renderList(); } 
 function removeSource(s, src) { coinSources[s] = coinSources[s].filter(i => i !== src); saveAll(); renderList(); } 
 
 function handleLogoError(img, symbol) { const cleanSymbol = symbol.toLowerCase().replace('usdt', '').replace('idr', ''); if (!img.dataset.step) { img.dataset.step = "1"; img.src = `https://assets.coincap.io/assets/icons/${cleanSymbol}@2x.png`; } else if (img.dataset.step === "1") { img.dataset.step = "2"; img.src = `https://cryptoicons.org/api/color/${cleanSymbol}/50`; } else if (img.dataset.step === "2") { img.dataset.step = "3"; img.src = `https://bin.bnbstatic.com/image/admin_mgs_image_center/${cleanSymbol}.png`; } else { img.onerror = null; img.src = "https://cdn-icons-png.flaticon.com/512/825/825508.png"; } } 
 function startHold(event, id, type) { moveHold(null); event.stopPropagation(); holdTimer = setTimeout(() => { event.preventDefault(); if (type === 'exchange') { confirmModal(`Hapus ${id}?`, 'delete', () => { allExchanges = allExchanges.filter(e => e !== id); saveAll(); renderList(); }); } else { confirmModal(`Edit ${id}?`, 'edit', () => { showEditKoin(id); }); } }, 600); } 
 function moveHold(event) { if (holdTimer) clearTimeout(holdTimer); holdTimer = null; } function clearHold() { if (holdTimer) clearTimeout(holdTimer); holdTimer = null; } 
 function confirmModal(title, type, okFunc) { const overlay = document.getElementById('modal-overlay'); const btns = document.getElementById('modal-btns'); document.getElementById('modal-title').innerText = title; document.getElementById('modal-input').style.display = 'none'; let btnHtml = `<button class="modal-btn btn-cancel" onclick="closeModal()">Batal</button>`; if (type === 'delete') btnHtml += `<button class="modal-btn btn-delete" id="modal-ok-btn">Hapus</button>`; else btnHtml += `<button class="modal-btn btn-ok" id="modal-ok-btn">OK</button>`; btns.innerHTML = btnHtml; document.getElementById('modal-ok-btn').onclick = () => { okFunc(); closeModal(); }; overlay.classList.add('active'); } 
 function closeModal() { document.getElementById('modal-overlay').classList.remove('active'); document.getElementById('modal-input').value = ""; } 
 function showEditKoin(id) { const overlay = document.getElementById('modal-overlay'); const input = document.getElementById('modal-input'); const btns = document.getElementById('modal-btns'); document.getElementById('modal-title').innerText = `EDIT NAME ${id}`; input.value = id; input.style.display = 'block'; btns.innerHTML = `<button class="modal-btn btn-cancel" onclick="closeModal()">Batal</button> <button class="modal-btn btn-delete" onclick="removeKoinGlobal('${id}')">Hapus Koin</button> <button class="modal-btn btn-ok" id="modal-ok-btn">Simpan</button>`; document.getElementById('modal-ok-btn').onclick = () => { renameKoinGlobal(id, input.value.trim().toUpperCase()); }; overlay.classList.add('active'); } 
 function removeKoinGlobal(id) { watchlist = watchlist.filter(c => c !== id); delete balances[id]; delete coinSources[id]; saveAll(); closeModal(); renderList(); fetchPrices(); } 
 function renameKoinGlobal(oldId, newId) { if (!newId || oldId === newId) { closeModal(); return; } if (watchlist.includes(newId)) { showToast("Nama koin sudah ada!"); return; } const idx = watchlist.indexOf(oldId); if (idx !== -1) watchlist[idx] = newId; if (balances[oldId]) { balances[newId] = balances[oldId]; delete balances[oldId]; } if (coinSources[oldId]) { coinSources[newId] = coinSources[oldId]; delete coinSources[oldId]; } saveAll(); closeModal(); renderList(); fetchPrices(); } 
 
 function renderList() { const list = document.getElementById('main-list'); const query = document.getElementById('filter-input').value.toUpperCase(); const sortType = document.getElementById('sort-order').value; let html = ""; if (currentTab === 'exchange') { let exArr = allExchanges.map(ex => { let t = 0; watchlist.forEach(s => { if(coinSources[s]?.includes(ex)) { const d = balances[s]?.[ex]; let b = (typeof d === 'object') ? (parseFloat(d.amount||0) + parseFloat(d.staking||0)) : parseFloat(d||0); t += (b * (prices[s] || 0)); }}); return { name: ex, totalValue: t }; }).filter(ex => ex.name.includes(query)); if (sortType === 'name') exArr.sort((a, b) => a.name.localeCompare(b.name)); else exArr.sort((a, b) => b.totalValue - a.totalValue); exArr.forEach(ex => { let brand = ex.name.split(' ')[0]; let suffix = ex.name.split(' ').slice(1).join(' '); const logo = exchangeLogos[brand] || ""; let subKoin = watchlist.filter(s => coinSources[s]?.includes(ex.name)); html += `<div class="coin-row"><div class="coin-card" onclick="toggleDetail('${ex.name}')" ontouchstart="startHold(event,'${ex.name}','exchange')" ontouchmove="moveHold(event)" ontouchend="clearHold()"><div class="logo-wrapper" style="background:#000">${logo && logo!=='any' ? `<img src="${logo}">` : `<div class="logo-initial">${brand.substring(0,2)}</div>`}</div><div class="info-group"><span class="symbol">${brand}</span>${suffix ? `<span style="font-size: 11px; color: var(--subtext); font-weight: normal;"> - ${suffix}</span>` : ''}</div><div style="text-align:right; margin-right:10px;"><span id="val-ex-${ex.name}" style="font-weight:bold; font-size:14px;">-</span></div></div><div id="det-${ex.name}" class="details" style="display:${expandedItem === ex.name ? 'block' : 'none'}">${subKoin.map(s => { const d = balances[s]?.[ex.name] || {amount:'', staking:''}; return `<div class="source-row"><label class="source-label"><div class="logo-wrapper" style="width:20px; height:20px; border:none; background:transparent;"><img src="any" onerror="handleLogoError(this, '${s}')"></div><span>${s}</span></label><div class="input-wrapper"><input type="number" class="source-input" inputmode="decimal" value="${d.amount||''}" oninput="updateBal('${s}','${ex.name}','amount',this.value)" placeholder="Amt"><input type="number" class="source-input" inputmode="decimal" value="${d.staking||''}" oninput="updateBal('${s}','${ex.name}','staking',this.value)" placeholder="Stk"></div><span class="del-src" onclick="removeCoinFromExchange('${s}','${ex.name}')">×</span></div>`; }).join('')}<div class="new-source-box"><input type="text" id="add-coin-to-${ex.name}" class="new-source-input" placeholder="Tambah Koin..."><button class="new-source-btn" onclick="addCoinToExchange('${ex.name}')">+</button></div></div></div>`; }); } else { let filtered = watchlist.filter(s => s.includes(query)); if (sortType === 'name') filtered.sort((a, b) => a.localeCompare(b)); else filtered.sort((a, b) => (getCoinTotal(b)*(prices[b]||0)) - (getCoinTotal(a)*(prices[a]||0))); filtered.forEach(s => { html += `<div class="coin-row"><div class="coin-card" onclick="toggleDetail('${s}')" ontouchstart="startHold(event,'${s}','coin')" ontouchmove="moveHold(event)" ontouchend="clearHold()"><div class="logo-wrapper"><img src="any" onerror="handleLogoError(this, '${s}')"></div><div class="info-group"><span class="symbol">${s}</span><span id="change-coin-${s}" class="change-pct">-</span><br><span id="price-coin-${s}" style="font-size:10px; color:var(--subtext)">-</span></div><div style="text-align:right; margin-right:10px;"><span style="font-weight:bold; font-size:13px;">${getCoinTotal(s).toLocaleString(undefined, {maximumFractionDigits:2})}</span><br><span id="val-coin-${s}" style="font-size:9px; color:var(--subtext)">-</span></div></div><div id="det-${s}" class="details" style="display:${expandedItem === s ? 'block' : 'none'}">${(coinSources[s]||[]).map(src => { const d = balances[s]?.[src] || {amount:'', staking:''}; return `<div class="source-row"><span class="source-label" style="padding-left:4px">${src}</span><div class="input-wrapper"><input type="number" class="source-input" inputmode="decimal" value="${d.amount||''}" oninput="updateBal('${s}','${src}','amount',this.value)" placeholder="Amt"><input type="number" class="source-input" inputmode="decimal" value="${d.staking||''}" oninput="updateBal('${s}','${src}','staking',this.value)" placeholder="Stk"></div><span class="del-src" onclick="removeSource('${s}','${src}')">×</span></div>`; }).join('')}<div class="new-source-box"><input type="text" id="new-src-input-${s}" class="new-source-input" placeholder="Source baru..."><button class="new-source-btn" onclick="addCustomSource('${s}')">+</button></div></div></div>`; }); } list.innerHTML = html; updatePricesOnly(); } 
 
 async function fetchPrices() { try { const [resBinance, resBybit, resKurs] = await Promise.all([ fetch('https://api.binance.com/api/v3/ticker/24hr').catch(()=>null), fetch('https://api.bybit.com/v5/market/tickers?category=spot').catch(()=>null), fetch('https://api.freecurrencyapi.com/v1/latest?apikey=fca_live_9M2S46b9C7bA8uEwWbE4xY9zM5N2gT4H4jH3bA8s&currencies=IDR').catch(()=>null) ]); // Kurs IDR if (resKurs) { const dataKurs = await resKurs.json(); usdToIdr = dataKurs.data.IDR; document.getElementById('usd-rate').innerText = usdToIdr.toLocaleString('id-ID'); } // prices = { 'USDT': 1, 'IDR': 1/usdToIdr }; changes = {}; // Binance if (resBinance) { const dataB = await resBinance.json(); dataB.forEach(coin => { let sym = coin.symbol.replace('USDT', ''); prices[sym] = parseFloat(coin.lastPrice); changes[sym] = parseFloat(coin.priceChangePercent).toFixed(2); }); } // Bybit fallback if (resBybit) { const dataBy = await resBybit.json(); if(dataBy?.result?.list) { dataBy.result.list.forEach(coin => { if(coin.symbol.includes('USDT')) { let sym = coin.symbol.replace('USDT', ''); if(!prices[sym]) { prices[sym] = parseFloat(coin.lastPrice); changes[sym] = (parseFloat(coin.price24hPcnt)*100).toFixed(2); } } }); } } renderList(); } catch(e) { console.error(e); } } function init() { renderList(); fetchPrices(); setInterval(fetchPrices, 15000); }
