<!DOCTYPE html><html lang="id"><head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"> <meta name="theme-color" content="#0f172a"> <link rel="manifest" href="manifest.json"> <title>PORTO</title> <style> :root { --bg: #0f172a; --card: #1e293b; --accent: #38bdf8; --text: #f8fafc; --subtext: #94a3b8; --up: #4ade80; --down: #f87171; --gray-btn: #334155; --red-muted: #991b1b; } * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; } html, body { background: var(--bg); color: var(--text); margin: 0; padding: 0; min-height: 100%; } .container { width: 100%; max-width: 420px; margin: 0 auto; display: flex; flex-direction: column; position: relative; } .top-flow { padding: 15px 15px 5px 15px; background: var(--bg); } .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; } .brand { font-size: 18px; font-weight: bold; color: var(--accent); } .kurs-info { font-size: 9px; color: var(--subtext); background: rgba(255,255,255,0.05); padding: 3px 6px; border-radius: 8px; border: 1px solid #334155; } .sticky-header { position: sticky; top: 0; z-index: 100; background: var(--bg); padding: 5px 15px 10px 15px; } .summary-card { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); border-radius: 12px; padding: 12px; margin-bottom: 10px; border: 1px solid var(--accent); text-align: center; } .summary-idr { font-size: 20px; font-weight: 800; display: block; } #total-all-usd { color: var(--subtext); font-size: 12px; } .tab-container { display: flex; gap: 8px; margin-bottom: 10px; background: rgba(255,255,255,0.05); padding: 4px; border-radius: 10px; border: 1px solid #334155; } .tab-btn { flex: 1; padding: 8px; border-radius: 6px; border: none; background: transparent; color: var(--subtext); cursor: pointer; font-weight: bold; font-size: 12px; transition: 0.3s; } .tab-btn.active { background: var(--accent); color: #0f172a; } .filter-input { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid #334155; border-radius: 10px; padding: 10px 12px; color: white; outline: none; font-size: 13px; margin-bottom: 8px; } .control-row { display: flex; justify-content: space-between; gap: 6px; margin-bottom: 5px; } .control-select { background: var(--card); color: white; border: 1px solid #334155; border-radius: 6px; font-size: 10px; padding: 6px; outline: none; cursor: pointer; flex: 1; } #main-list { padding: 5px 10px 20px 10px; min-height: 60vh; } .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 2000; display: none; align-items: center; justify-content: center; padding: 20px; } .modal-content { width: 100%; max-width: 340px; background: var(--card); border: 1px solid var(--accent); border-radius: 15px; padding: 20px; transform: scale(0.9); transition: transform 0.2s; } .modal-overlay.active { display: flex; } .modal-title { font-weight: bold; font-size: 14px; text-align: center; margin-bottom: 15px; color: var(--text); } .modal-input { width: 100%; background: #000; border: 1px solid var(--accent); color: #fff; padding: 12px; border-radius: 8px; margin-bottom: 15px; outline: none; font-size: 14px; text-align: center; } .modal-btns { display: flex; gap: 8px; justify-content: center; } .modal-btn { flex: 1; padding: 12px 5px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 11px; } .btn-delete { background: var(--red-muted); color: white; } .btn-ok { background: var(--accent); color: #0f172a; } .btn-cancel { background: #334155; color: #b0b0b0; } .coin-row { margin-bottom: 8px; } .coin-card { background: var(--card); border-radius: 12px; padding: 10px; display: flex; align-items: center; cursor: pointer; border: 1px solid transparent; -webkit-user-select: none; user-select: none; } .logo-wrapper { width: 34px; height: 34px; margin-right: 12px; border-radius: 50%; border: 1px solid #334155; display: flex; align-items: center; justify-content: center; overflow: hidden; } .logo-wrapper img { width: 100%; height: 100%; object-fit: cover; } .info-group { flex-grow: 1; } .symbol { font-weight: 800; font-size: 16px; color: #fff; } .change-pct { font-size: 10px; margin-left: 5px; font-weight: bold; padding: 1px 4px; border-radius: 4px; } .up { background: rgba(74,222,128,0.2); color: #4ade80; } .down { background: rgba(248,113,113,0.2); color: #f87171; } .details { display: none; padding: 10px; background: rgba(255,255,255,0.02); border-radius: 0 0 12px 12px; border: 1px solid #334155; border-top: none; } .source-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid #2d3a4f; } .source-input { width: 50%; background: #000; border: 1px solid #334155; color: #fff; padding: 8px; border-radius: 6px; font-size: 12px; outline: none; text-align: center; } .global-add { position: sticky; bottom: 15px; margin: 0 15px; display: flex; gap: 8px; background: var(--bg); padding: 5px; border-radius: 12px; z-index: 10; border: 1px solid #334155; } .global-add input { flex: 3; background: #000; border: 1px solid #334155; color: white; border-radius: 8px; padding: 12px; outline: none; } .global-add button { flex: 1; background: var(--accent); color: #0f172a; border: none; border-radius: 8px; font-weight: bold; } </style></head><body>
<div class="container">
    <div class="top-flow">
        <div class="header"><span class="brand">PORTO</span> <span class="kurs-info">USD/IDR <span id="usd-rate">-</span></span></div>
    </div>
    <div class="sticky-header">
        <div class="summary-card" onclick="toggleCurrencyView()">
            <span class="summary-idr" id="total-all-idr">Rp 0</span>
            <span id="total-all-usd">$0.00</span>
        </div>
        <div class="tab-container">
            <button class="tab-btn active" onclick="switchTab('coin')">COIN</button>
            <button class="tab-btn" onclick="switchTab('exchange')">EXCHANGE</button>
        </div>
        <input type="text" id="filter-input" class="filter-input" placeholder="Cari..." oninput="renderList()">
        <div class="control-row">
            <select id="sort-order" class="control-select" onchange="renderList()">
                <option value="name">Urut Nama</option>
                <option value="value">Urut Nilai</option>
            </select>
        </div>
    </div>
    <div id="main-list"></div>
    <div class="global-add">
        <input type="text" id="global-add-input" placeholder="Tambah..." onkeypress="if(event.key==='Enter') handleGlobalAdd()">
        <button onclick="handleGlobalAdd()">+</button>
    </div>
</div>

<div id="modal-overlay" class="modal-overlay" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <div id="modal-title" class="modal-title"></div>
        <input type="text" id="modal-input" class="modal-input" style="display:none">
        <div id="modal-btns" class="modal-btns"></div>
    </div>
</div>

<script>
    let watchlist = JSON.parse(localStorage.getItem('my_assets_v2')) || ['BTC','ETH','USDT'];
    let balances = JSON.parse(localStorage.getItem('my_balances_v2')) || {};
    let coinSources = JSON.parse(localStorage.getItem('my_coin_sources')) || {};
    let allExchanges = JSON.parse(localStorage.getItem('my_exchanges_v2')) || ['Spot'];
    let prices = {}; let changes = {}; let usdToIdr = 16300;
    let currentTab = 'coin'; let currencyView = localStorage.getItem('my_currency_v') || 'USD';
    let expandedItem = null; let holdTimer = null;

    function handleLogoError(img, symbol) {
        const clean = symbol.toLowerCase().replace('usdt', '');
        if (!img.dataset.step) {
            img.dataset.step = "1";
            img.src = `https://assets.coincap.io/assets/icons/${clean}@2x.png`;
        } else if (img.dataset.step === "1") {
            img.dataset.step = "2";
            img.src = `https://cryptoicons.org/api/color/${clean}/50`;
        } else {
            img.onerror = null;
            img.src = "https://cdn-icons-png.flaticon.com/512/825/825508.png";
        }
    }

    async function fetchPrices() {
        try {
            const [resBinance, resBybit, resKurs] = await Promise.all([
                fetch('https://api.binance.com/api/v3/ticker/24hr').catch(()=>null),
                fetch('https://api.bybit.com/v5/market/tickers?category=spot').catch(()=>null),
                fetch('https://api.exchangerate-api.com/v4/latest/USD').catch(()=>null)
            ]);
            if(resKurs) { const d = await resKurs.json(); usdToIdr = d.rates.IDR; document.getElementById('usd-rate').innerText = usdToIdr.toLocaleString(); }
            if(resBinance) {
                const data = await resBinance.json();
                data.forEach(c => { if(c.symbol.endsWith('USDT')) { let s = c.symbol.replace('USDT',''); prices[s] = parseFloat(c.lastPrice); changes[s] = parseFloat(c.priceChangePercent).toFixed(2); } });
            }
            if(resBybit) {
                const data = await resBybit.json();
                data.result.list.forEach(c => { let s = c.symbol.replace('USDT',''); if(!prices[s]) { prices[s] = parseFloat(c.lastPrice); changes[s] = (parseFloat(c.price24hPcnt)*100).toFixed(2); } });
            }
            prices['USDT'] = 1; renderList();
        } catch(e) { console.log(e); }
    }

    function renderList() {
        const list = document.getElementById('main-list');
        const query = document.getElementById('filter-input').value.toUpperCase();
        let html = ""; let totalUsd = 0;

        if (currentTab === 'coin') {
            watchlist.filter(s => s.includes(query)).forEach(s => {
                const bal = Object.values(balances[s] || {}).reduce((a,b) => a + (parseFloat(b.amount||0)+parseFloat(b.staking||0)), 0);
                const val = bal * (prices[s] || 0); totalUsd += val;
                html += `<div class="coin-row"><div class="coin-card" onclick="toggleDetail('${s}')" ontouchstart="startHold('${s}','coin')" ontouchend="clearHold()"><div class="logo-wrapper"><img src="https://bin.bnbstatic.com/image/admin_mgs_image_center/${s.toLowerCase()}.png" onerror="handleLogoError(this,'${s}')"></div><div class="info-group"><span class="symbol">${s}</span><span class="change-pct ${parseFloat(changes[s])>=0?'up':'down'}">${changes[s]||'0.00'}%</span><br><span style="font-size:10px;color:var(--subtext)">$${(prices[s]||0).toLocaleString()}</span></div><div style="text-align:right"><b>${bal.toLocaleString()}</b><br><span style="font-size:9px;color:var(--subtext)">${currencyView==='IDR'?'Rp '+(val*usdToIdr).toLocaleString():'$'+val.toLocaleString()}</span></div></div><div id="det-${s}" class="details" style="display:${expandedItem===s?'block':'none'}">${(coinSources[s]||[]).map(src => `<div class="source-row"><span>${src}</span><input type="number" class="source-input" value="${balances[s][src].amount||''}" oninput="updateBal('${s}','${src}','amount',this.value)" placeholder="Amt"><input type="number" class="source-input" value="${balances[s][src].staking||''}" oninput="updateBal('${s}','${src}','staking',this.value)" placeholder="Stk"></div>`).join('')}<div class="new-source-box"><input type="text" id="new-src-${s}" placeholder="Source baru..."><button onclick="addSource('${s}')">+</button></div></div></div>`;
            });
        }
        list.innerHTML = html;
        document.getElementById('total-all-idr').innerText = 'Rp ' + (totalUsd * usdToIdr).toLocaleString();
        document.getElementById('total-all-usd').innerText = '$' + totalUsd.toLocaleString();
    }

    function toggleDetail(id) { expandedItem = (expandedItem === id ? null : id); renderList(); }
    function updateBal(s, src, type, v) { if(!balances[s]) balances[s]={}; if(!balances[s][src]) balances[s][src]={amount:0, staking:0}; balances[s][src][type] = v; localStorage.setItem('my_balances_v2', JSON.stringify(balances)); fetchPrices(); }
    function switchTab(t) { currentTab = t; document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active')); renderList(); }
    function toggleCurrencyView() { currencyView = (currencyView==='IDR'?'USD':'IDR'); localStorage.setItem('my_currency_v', currencyView); renderList(); }
    function handleGlobalAdd() { const v = document.getElementById('global-add-input').value.toUpperCase(); if(v && !watchlist.includes(v)) { watchlist.push(v); coinSources[v]=[]; localStorage.setItem('my_assets_v2', JSON.stringify(watchlist)); fetchPrices(); } }
    function addSource(s) { const v = document.getElementById('new-src-'+s).value.toUpperCase(); if(v) { if(!coinSources[s]) coinSources[s]=[]; coinSources[s].push(v); if(!balances[s]) balances[s]={}; balances[s][v]={amount:0, staking:0}; localStorage.setItem('my_coin_sources', JSON.stringify(coinSources)); renderList(); } }
    function startHold(id, type) { holdTimer = setTimeout(() => { confirmModal(`Hapus ${id}?`, () => { watchlist = watchlist.filter(x => x!==id); localStorage.setItem('my_assets_v2', JSON.stringify(watchlist)); renderList(); }); }, 800); }
    function clearHold() { clearTimeout(holdTimer); }
    function confirmModal(txt, fn) { document.getElementById('modal-title').innerText = txt; document.getElementById('modal-btns').innerHTML = `<button class="modal-btn btn-cancel" onclick="closeModal()">Batal</button><button class="modal-btn btn-delete" id="m-ok">Hapus</button>`; document.getElementById('m-ok').onclick = () => { fn(); closeModal(); }; document.getElementById('modal-overlay').classList.add('active'); }
    function closeModal() { document.getElementById('modal-overlay').classList.remove('active'); }

    window.onload = () => { fetchPrices(); setInterval(fetchPrices, 30000); };
</script>
</body></html>
