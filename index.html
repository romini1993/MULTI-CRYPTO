<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#080d14">
<link rel="manifest" href="manifest.json">
<title>PORTO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #080d14;
  --bg2: #0d1520;
  --card: #111923;
  --card2: #16202e;
  --border: #1e2d3d;
  --accent: #00d4ff;
  --accent2: #0099cc;
  --accent-glow: rgba(0,212,255,0.15);
  --text: #e8f4f8;
  --subtext: #5a7a8c;
  --subtext2: #3d5a6a;
  --up: #00e5a0;
  --down: #ff4d6a;
  --up-bg: rgba(0,229,160,0.08);
  --down-bg: rgba(255,77,106,0.08);
  --mono: 'Space Mono', monospace;
  --sans: 'DM Sans', sans-serif;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
/* Disable scroll on number inputs */
input[type=number] { -moz-appearance: textfield; }
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

html, body {
  background: var(--bg);
  color: var(--text);
  margin: 0; padding: 0;
  font-family: var(--sans);
  min-height: 100%;
  overflow-x: hidden;
}

/* ---- LAYOUT ---- */
.app-shell {
  width: 100%;
  max-width: 520px;
  margin: 0 auto;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  position: relative;
}

@media (min-width: 768px) {
  .app-shell { max-width: 680px; }
}

/* ---- HEADER ---- */
.top-bar {
  padding: 16px 18px 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg);
}

.brand {
  font-family: var(--mono);
  font-size: 22px;
  font-weight: 700;
  color: var(--accent);
  letter-spacing: 3px;
  text-shadow: 0 0 20px rgba(0,212,255,0.4);
  position: relative;
}
.brand::after {
  content: '';
  position: absolute;
  bottom: -2px; left: 0;
  width: 100%; height: 1px;
  background: linear-gradient(90deg, var(--accent), transparent);
}

.kurs-badge {
  font-family: var(--mono);
  font-size: 9px;
  color: var(--subtext);
  background: var(--card);
  padding: 4px 8px;
  border-radius: 6px;
  border: 1px solid var(--border);
  letter-spacing: 0.5px;
}

/* ---- STICKY ZONE ---- */
.sticky-zone {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--bg);
  padding: 0 18px 10px;
}

/* ---- SUMMARY CARD ---- */
.summary-card {
  background: linear-gradient(135deg, #0d1a26 0%, #091420 50%, #0a1825 100%);
  border-radius: 16px;
  padding: 18px 20px;
  margin-bottom: 12px;
  border: 1px solid var(--border);
  text-align: center;
  position: relative;
  overflow: hidden;
}
.summary-card::before {
  content: '';
  position: absolute;
  top: -40px; left: 50%; transform: translateX(-50%);
  width: 200px; height: 80px;
  background: radial-gradient(ellipse, rgba(0,212,255,0.12), transparent 70%);
  pointer-events: none;
}
.summary-label {
  font-family: var(--mono);
  font-size: 8px;
  color: var(--accent);
  letter-spacing: 3px;
  text-transform: uppercase;
  display: block;
  margin-bottom: 6px;
}
.summary-idr {
  font-family: var(--mono);
  font-size: 26px;
  font-weight: 700;
  color: var(--text);
  display: block;
  line-height: 1.1;
}
.summary-usd {
  font-size: 12px;
  color: var(--subtext);
  margin-top: 3px;
  display: block;
  font-family: var(--mono);
}

/* ---- TABS ---- */
.tab-row {
  display: flex;
  gap: 6px;
  background: var(--card);
  padding: 4px;
  border-radius: 10px;
  border: 1px solid var(--border);
  margin-bottom: 10px;
}
.tab-btn {
  flex: 1;
  padding: 8px;
  border-radius: 7px;
  border: none;
  background: transparent;
  color: var(--subtext);
  cursor: pointer;
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
  transition: all 0.25s ease;
}
.tab-btn.active {
  background: var(--accent);
  color: #000;
  box-shadow: 0 0 12px rgba(0,212,255,0.3);
}

/* ---- CONTROLS ---- */
.filter-input {
  width: 100%;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 14px;
  color: var(--text);
  outline: none;
  font-size: 13px;
  font-family: var(--sans);
  margin-bottom: 8px;
  transition: border-color 0.2s;
}
.filter-input:focus { border-color: var(--accent2); }
.filter-input::placeholder { color: var(--subtext2); }

.control-row { display: flex; gap: 6px; margin-bottom: 4px; }
.control-select {
  background: var(--card);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 10px;
  padding: 7px 8px;
  outline: none;
  cursor: pointer;
  flex: 1;
  font-family: var(--sans);
}

/* ---- MAIN LIST ---- */
#main-list {
  padding: 6px 18px 120px;
  flex: 1;
}

/* ---- COIN ROW / CARD ---- */
.coin-row { margin-bottom: 6px; }

.coin-card {
  background: var(--card);
  border-radius: 12px;
  padding: 11px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  border: 1px solid var(--border);
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  transition: border-color 0.2s, background 0.2s;
  position: relative;
}
.coin-card:active { background: var(--card2); }
.coin-card.expanded { border-radius: 12px 12px 0 0; border-color: var(--accent2); }

.logo-wrap {
  width: 34px; height: 34px;
  border-radius: 50%;
  overflow: hidden;
  border: 1px solid var(--border);
  flex-shrink: 0;
  background: var(--bg2);
  display: flex; align-items: center; justify-content: center;
}
.logo-wrap img { width: 100%; height: 100%; object-fit: cover; }
.logo-init {
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--mono);
  font-size: 10px; font-weight: 700;
  color: var(--accent);
}

.info-grp { flex: 1; min-width: 0; }
.sym {
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: 0.5px;
}
.sym-sub {
  font-size: 10px;
  color: var(--subtext);
  font-weight: 400;
  margin-left: 4px;
}
.change-pct {
  font-family: var(--mono);
  font-size: 9px; font-weight: 700;
  margin-left: 4px;
}
.price-line {
  font-size: 10px;
  color: var(--subtext);
  margin-top: 1px;
  font-family: var(--mono);
}
.up { color: var(--up); }
.down { color: var(--down); }

.val-right {
  text-align: right;
  flex-shrink: 0;
}
.val-main {
  font-family: var(--mono);
  font-weight: 700;
  font-size: 13px;
  color: var(--text);
}
.val-sub {
  font-family: var(--mono);
  font-size: 9px;
  color: var(--subtext);
  margin-top: 1px;
}

/* Expand chevron */
.chevron {
  width: 16px; height: 16px;
  margin-left: 6px;
  flex-shrink: 0;
  transition: transform 0.3s ease;
  color: var(--subtext2);
}
.coin-card.expanded .chevron { transform: rotate(180deg); }

/* ---- DETAILS PANEL (smooth) ---- */
.det-wrapper {
  overflow: hidden;
  max-height: 0;
  transition: max-height 0.35s cubic-bezier(0.4,0,0.2,1), opacity 0.3s ease;
  opacity: 0;
  background: #0c1620;
  border: 1px solid var(--accent2);
  border-top: none;
  border-radius: 0 0 12px 12px;
}
.det-wrapper.open {
  max-height: 600px;
  opacity: 1;
}
.det-inner { padding: 10px 12px 12px; }

/* Source row inside detail */
.src-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}
.src-row:last-of-type { border-bottom: none; margin-bottom: 4px; }

.src-label {
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text);
  min-width: 80px;
  flex-shrink: 0;
}
.src-logo { width: 18px; height: 18px; border-radius: 50%; overflow: hidden; flex-shrink: 0; }
.src-logo img { width: 100%; height: 100%; object-fit: cover; }

.src-inputs {
  display: flex;
  flex-direction: column;
  gap: 4px;
  flex: 1;
}
.src-input-row { display: flex; gap: 4px; align-items: center; }

.src-input {
  flex: 1;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 6px;
  padding: 6px 8px;
  font-size: 12px;
  font-family: var(--mono);
  outline: none;
  transition: border-color 0.2s;
  min-width: 0;
}
.src-input:focus { border-color: var(--accent2); }
.src-input::placeholder { color: var(--subtext2); font-size: 10px; }

/* Estimate value next to input */
.est-val {
  font-family: var(--mono);
  font-size: 9px;
  color: var(--subtext);
  text-align: right;
  min-width: 60px;
  flex-shrink: 0;
  line-height: 1.3;
}
.est-usd { color: var(--subtext); }

.del-btn {
  color: var(--down);
  font-size: 16px;
  cursor: pointer;
  padding: 0 2px;
  flex-shrink: 0;
  opacity: 0.6;
  transition: opacity 0.15s;
}
.del-btn:hover { opacity: 1; }

.new-src-box {
  display: flex;
  gap: 5px;
  margin-top: 8px;
  padding-top: 10px;
  border-top: 1px solid var(--border);
}
.new-src-input {
  flex: 1;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 6px;
  padding: 7px 8px;
  font-size: 11px;
  font-family: var(--mono);
  outline: none;
}
.new-src-input:focus { border-color: var(--accent2); }
.new-src-input::placeholder { color: var(--subtext2); }
.new-src-btn {
  background: var(--border);
  color: var(--accent);
  border: none;
  border-radius: 6px;
  padding: 0 14px;
  font-family: var(--mono);
  font-weight: 700;
  cursor: pointer;
  font-size: 16px;
  transition: background 0.2s;
}
.new-src-btn:hover { background: var(--card2); }

/* ---- BOTTOM NAV ---- */
.bottom-nav {
  position: fixed;
  bottom: 0; left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 520px;
  z-index: 200;
  background: linear-gradient(to top, var(--bg) 85%, transparent);
  padding: 8px 18px 16px;
}
@media (min-width: 768px) {
  .bottom-nav { max-width: 680px; }
}

.add-bar {
  display: flex;
  gap: 6px;
  margin-bottom: 6px;
}
.add-input {
  flex: 1;
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 10px 14px;
  border-radius: 10px;
  outline: none;
  font-size: 13px;
  font-family: var(--sans);
  transition: border-color 0.2s;
}
.add-input:focus { border-color: var(--accent2); }
.add-input::placeholder { color: var(--subtext2); }
.add-btn {
  background: var(--accent);
  border: none;
  padding: 0 16px;
  border-radius: 10px;
  font-family: var(--mono);
  font-weight: 700;
  cursor: pointer;
  font-size: 11px;
  color: #000;
  letter-spacing: 0.5px;
  box-shadow: 0 0 12px rgba(0,212,255,0.25);
  transition: box-shadow 0.2s;
}
.add-btn:active { box-shadow: 0 0 6px rgba(0,212,255,0.1); }

.action-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr 1fr;
  gap: 4px;
}
.action-btn {
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--subtext);
  padding: 7px 4px;
  border-radius: 8px;
  font-size: 9px;
  font-family: var(--mono);
  cursor: pointer;
  text-align: center;
  transition: all 0.2s;
  letter-spacing: 0.3px;
}
.action-btn:hover { border-color: var(--accent2); color: var(--accent); }
.action-btn.import-full {
  grid-column: span 4;
  border-color: var(--accent2);
  color: var(--accent);
}

/* ---- MODAL ---- */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.88);
  z-index: 2000;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  backdrop-filter: blur(4px);
}
.modal-overlay.active { display: flex; }

.modal-box {
  width: 100%; max-width: 320px;
  background: var(--card2);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 24px 20px;
  animation: popIn 0.2s ease;
}
@keyframes popIn {
  from { transform: scale(0.92); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

.modal-title {
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 1px;
  text-align: center;
  margin-bottom: 16px;
  color: var(--text);
}
.modal-input {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 12px;
  border-radius: 8px;
  margin-bottom: 16px;
  outline: none;
  font-family: var(--mono);
  font-size: 13px;
  text-align: center;
}
.modal-input:focus { border-color: var(--accent2); }
.modal-btns { display: flex; gap: 8px; }
.mbtn {
  flex: 1; padding: 11px 6px;
  border: none; border-radius: 8px;
  font-family: var(--mono);
  font-weight: 700; font-size: 10px;
  letter-spacing: 0.5px;
  cursor: pointer;
  transition: opacity 0.15s;
}
.mbtn:active { opacity: 0.75; }
.mbtn-ok { background: var(--accent); color: #000; }
.mbtn-del { background: rgba(255,77,106,0.15); color: var(--down); border: 1px solid var(--down); }
.mbtn-edit { background: var(--card); color: var(--accent); border: 1px solid var(--border); }
.mbtn-cancel { background: var(--card); color: var(--subtext); border: 1px solid var(--border); }

/* ---- TOAST ---- */
#toast {
  visibility: hidden;
  position: fixed;
  bottom: 120px; left: 50%; transform: translateX(-50%);
  background: var(--card2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 9px 18px;
  border-radius: 20px;
  font-size: 11px;
  font-family: var(--mono);
  z-index: 3000;
  white-space: nowrap;
  transition: opacity 0.3s;
  opacity: 0;
}
#toast.show { visibility: visible; opacity: 1; }

/* ---- LANDSCAPE / DESKTOP ---- */
@media (min-width: 600px) and (orientation: landscape), (min-width: 768px) {
  .summary-idr { font-size: 30px; }
}

</style>
</head>
<body>

<div id="modal-overlay" class="modal-overlay" onclick="closeModal()">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div id="modal-title" class="modal-title"></div>
    <input type="text" id="modal-input" class="modal-input" style="display:none">
    <div id="modal-btns" class="modal-btns"></div>
  </div>
</div>

<div class="app-shell">
  <div class="top-bar">
    <div class="brand">PORTO</div>
    <div id="kurs-badge" class="kurs-badge">USD/IDR: ···</div>
  </div>

  <div class="sticky-zone">
    <div class="summary-card">
      <span class="summary-label">TOTAL SALDO</span>
      <span id="total-idr" class="summary-idr">Rp 0</span>
      <span id="total-usd" class="summary-usd">$0.00</span>
    </div>
    <div class="tab-row">
      <button id="tab-ex" class="tab-btn active" onclick="switchTab('exchange')">EXCHANGE</button>
      <button id="tab-coin" class="tab-btn" onclick="switchTab('coin')">COIN</button>
    </div>
    <input type="text" id="filter-input" class="filter-input" placeholder="Cari..." oninput="renderList()">
    <div class="control-row">
      <select id="sort-order" class="control-select" onchange="updateSettings()">
        <option value="manual">Urutan: Default</option>
        <option value="name">Urutan: A-Z</option>
        <option value="value">Urutan: Terbesar</option>
        <option value="gainers">Urutan: Gainers</option>
      </select>
      <select id="currency-view" class="control-select" onchange="updateSettings()">
        <option value="IDR">Mata Uang: IDR</option>
        <option value="USD">Mata Uang: USD</option>
      </select>
    </div>
  </div>

  <div id="main-list"></div>
</div>

<!-- BOTTOM NAV (fixed) -->
<div class="bottom-nav">
  <div class="add-bar">
    <input type="text" id="global-add-input" class="add-input" placeholder="Tambah Exchange / Coin..." onkeypress="if(event.key==='Enter') handleGlobalAdd()">
    <button class="add-btn" onclick="handleGlobalAdd()">TAMBAH</button>
  </div>
  <div class="action-grid">
    <button class="action-btn" onclick="openBackupPopup()">📤 Backup</button>
    <button class="action-btn" onclick="confirmModal('RESTORE DATA?','ok',()=>openFilePicker('restore'))">🔄 Restore</button>
    <button class="action-btn" onclick="openExcelPopup()">📊 Excel</button>
    <button class="action-btn" onclick="confirmModal('RESET SEMUA DATA?','delete',()=>resetApp())" style="color:var(--down)">⚠️ Reset</button>
    <button class="action-btn import-full" onclick="confirmModal('IMPORT DAN GABUNG?','ok',()=>openFilePicker('import'))">📥 Import & Gabung</button>
  </div>
</div>

<div id="toast"></div>
<input type="file" id="importFile" style="display:none" accept=".json" onchange="handleFileSelect(event)">

<script>
// ---- STATE ----
let usdToIdr = 16000;

let expandedItem = null, currentMode = 'restore';
let holdTimer, startX, startY;

const exchangeLogos = {

  "IMTOKEN":"https://res.cloudinary.com/dor7smqah/image/upload/v1774081431/unnamed_3_whdxwy.png",
  "SUI":"https://assets.coingecko.com/asset_platforms/images/126/standard/sui-ocean-square.png?1727791325",
  "SOL":"https://assets.coingecko.com/asset_platforms/images/5/standard/solana.png?1706606708",
  "TON":"https://assets.coingecko.com/asset_platforms/images/142/small/tonblockchain.jpeg?1706606805",
  "KEPLR":"https://res.cloudinary.com/dor7smqah/image/upload/v1774079462/keplr-icon-radii_doymj6.png",

// ---- LOGO ----
function handleLogoError(img, sym) {
  if (sym === 'IDR') { img.parentElement.innerHTML = `<div class="logo-init" style="background:#004d20">RP</div>`; return; }
  const retry = parseInt(img.getAttribute('data-retry') || "0");
  const s = sym.toLowerCase();
  const sources = [
    `https://gate.io/images/coin_icon/64/${s}.png`,
    `https://assets.coincap.io/assets/icons/${s}@2x.png`,
    `https://static.okx.com/cdn/oksupport/asset/currency/icon/${s}.png`
  ];
  if (retry < sources.length) { img.setAttribute('data-retry', retry+1); img.src = sources[retry]; }
  else { img.parentElement.innerHTML = `<div class="logo-init">${sym.substring(0,2)}</div>`; }
}

// ---- DISABLE SCROLL ON INPUTS ----
document.addEventListener('wheel', (e) => {
  if (document.activeElement.type === 'number') e.preventDefault();
}, { passive: false });

// ---- INIT ----
window.onload = () => {
  migrateToUppercase();
  document.getElementById('sort-order').value = localStorage.getItem('last_sort') || 'manual';
  document.getElementById('currency-view').value = localStorage.getItem('last_cur') || 'IDR';
  renderList();
  fetchKurs();
  fetchCoinMap();
  fetchAll();
  setInterval(fetchAll, 60000);
};

function migrateToUppercase() {
  let ns = false;
  watchlist = watchlist.map(s => { if(s !== s.toUpperCase()) ns=true; return s.toUpperCase(); });
  allExchanges = allExchanges.map(ex => { if(ex !== ex.toUpperCase()) ns=true; return ex.toUpperCase(); });
  for (let c in coinSources) {
    let u = c.toUpperCase(); if(c!==u){coinSources[u]=coinSources[c];delete coinSources[c];ns=true;}
    coinSources[u] = coinSources[u].map(s=>{if(s!==s.toUpperCase())ns=true;return s.toUpperCase();});
  }
  let nb={};
  for(let c in balances){
    let u=c.toUpperCase(); nb[u]={};
    for(let s in balances[c]){
      let su=s.toUpperCase();
      nb[u][su] = (typeof balances[c][s]==='object') ? balances[c][s] : {amount:balances[c][s],staking:''};
    }
  }
  balances=nb; if(ns) saveAll();
}

// ---- FETCH ----
async function fetchKurs() {
  try {
    const r = await fetch('https://api.binance.com/api/v3/ticker/price?symbol=USDTIDR');
    const d = await r.json();
    if(d.price){ usdToIdr=parseFloat(d.price); document.getElementById('kurs-badge').innerText=`USD/IDR: ${Math.round(usdToIdr).toLocaleString('id-ID')}`; updatePricesOnly(); }
  } catch(e){}
}
async function fetchCoinMap() {
  try {
    const r = await fetch('https://api.coingecko.com/api/v3/coins/list');
    (await r.json()).forEach(c => { coinMapCG[c.symbol.toUpperCase()] = c.id; });
  } catch(e){}
}
async function fetchAll() {
  if(isFetching) return; isFetching=true;
  let rem = watchlist.filter(s=>!['IDR','USDT','USDC','USD','BUSD'].includes(s));
  try {
    const res = await fetch('https://api.bybit.com/v5/market/tickers?category=spot');
    const data = await res.json();
    if(data.result?.list){ data.result.list.forEach(item=>{ let sym=item.symbol.replace('USDT',''); if(rem.includes(sym)){prices[sym]=parseFloat(item.lastPrice);changes[sym]=(parseFloat(item.price24hPcnt)*100).toFixed(2);rem=rem.filter(c=>c!==sym);} }); }
  } catch(e){}
  if(rem.length>0){
    try {
      const res = await fetch('https://api.binance.com/api/v3/ticker/24hr');
      const data = await res.json();
      data.forEach(item=>{ let sym=item.symbol.replace('USDT',''); if(rem.includes(sym)){prices[sym]=parseFloat(item.lastPrice);changes[sym]=parseFloat(item.priceChangePercent).toFixed(2);rem=rem.filter(c=>c!==sym);} });
    } catch(e){}
  }
  for(const s of rem){ if(coinMapCG[s]){ try { const r=await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${coinMapCG[s]}&vs_currencies=usd&include_24hr_change=true`); const d=await r.json(); if(d[coinMapCG[s]]){prices[s]=d[coinMapCG[s]].usd;changes[s]=d[coinMapCG[s]].usd_24h_change?d[coinMapCG[s]].usd_24h_change.toFixed(2):"0.00";} }catch(e){} } }
  watchlist.forEach(s=>{ if(s==='IDR'){prices[s]=1/usdToIdr;changes[s]="0.00";}else if(['USDT','USDC','USD','BUSD'].includes(s)){prices[s]=1;changes[s]="0.00";}else if(!prices[s]){prices[s]=0;changes[s]="0.00";} });
  updatePricesOnly(); isFetching=false;
}

// ---- HELPERS ----
function getCoinTotal(sym){ let t=0; (coinSources[sym]||[]).forEach(src=>{ const d=balances[sym]?.[src]; t+=(typeof d==='object')?(parseFloat(d.amount||0)+parseFloat(d.staking||0)):parseFloat(d||0); }); return t; }

function fmtUsd(n){ return '$'+n.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtIdr(n){ return 'Rp '+Math.round(n).toLocaleString('id-ID'); }
function fmtVal(usd){ const cv=document.getElementById('currency-view').value; return cv==='IDR' ? fmtIdr(usd*usdToIdr) : fmtUsd(usd); }

// ---- UPDATE PRICES (no full re-render) ----
function updatePricesOnly() {
  const cv = document.getElementById('currency-view').value;
  let totalUsd = 0;

  if(currentTab==='exchange'){
    allExchanges.forEach(ex=>{
      let t=0;
      watchlist.forEach(sym=>{ if(coinSources[sym]?.includes(ex)){const d=balances[sym]?.[ex];let b=(typeof d==='object')?(parseFloat(d.amount||0)+parseFloat(d.staking||0)):parseFloat(d||0);t+=b*(prices[sym]||0);} });
      totalUsd+=t;
      const el=document.getElementById(`val-ex-${ex}`);
      if(el) el.innerText=fmtVal(t);
      // update estimates inside expanded detail
      watchlist.forEach(sym=>{ if(coinSources[sym]?.includes(ex)){ updateEstimates(sym, ex); } });
    });
  } else {
    watchlist.forEach(sym=>{
      const val=getCoinTotal(sym)*(prices[sym]||0); totalUsd+=val;
      const elV=document.getElementById(`val-coin-${sym}`);
      const elP=document.getElementById(`price-coin-${sym}`);
      const elC=document.getElementById(`change-coin-${sym}`);
      if(elV) elV.innerText=fmtVal(val);
      if(elP) elP.innerText=sym==='IDR'?'Stable IDR':'$'+(prices[sym]||0).toLocaleString(undefined,{minimumFractionDigits:(prices[sym]||0)<1?4:2});
      if(elC){ const c=changes[sym]||"0.00"; elC.innerText=`${parseFloat(c)>=0?'+':''}${c}%`; elC.className=`change-pct ${parseFloat(c)>=0?'up':'down'}`; }
      // update estimates
      (coinSources[sym]||[]).forEach(src=>{ updateEstimates(sym,src); });
    });
  }

  document.getElementById('total-idr').innerText=`Rp ${Math.round(totalUsd*usdToIdr).toLocaleString('id-ID')}`;
  document.getElementById('total-usd').innerText=`$${totalUsd.toLocaleString(undefined,{minimumFractionDigits:2})}`;
}

// update estimate labels for amount & staking
function updateEstimates(sym, src) {
  const d = balances[sym]?.[src];
  const amt = (typeof d==='object') ? parseFloat(d.amount||0) : parseFloat(d||0);
  const stk = (typeof d==='object') ? parseFloat(d.staking||0) : 0;
  const p = prices[sym] || 0;
  const cv = document.getElementById('currency-view').value;

  const elAmt = document.getElementById(`est-amt-${sym}-${src.replace(/\s/g,'_')}`);
  const elStk = document.getElementById(`est-stk-${sym}-${src.replace(/\s/g,'_')}`);

  if(elAmt) {
    if(amt>0 && p>0){
      const usd=amt*p;
      elAmt.innerHTML=`<span class="est-usd">~${cv==='IDR'?fmtIdr(usd*usdToIdr):fmtUsd(usd)}</span>`;
    } else { elAmt.innerHTML=''; }
  }
  if(elStk){
    if(stk>0 && p>0){
      const usd=stk*p;
      elStk.innerHTML=`<span class="est-usd">~${cv==='IDR'?fmtIdr(usd*usdToIdr):fmtUsd(usd)}</span>`;
    } else { elStk.innerHTML=''; }
  }
}

// ---- EXPAND ----
function toggleDetail(id) {
  // close prev
  if(expandedItem && expandedItem !== id){
    const oldCard = document.querySelector(`.coin-card[data-id="${expandedItem}"]`);
    const oldDet = document.getElementById(`det-${expandedItem}`);
    if(oldCard) oldCard.classList.remove('expanded');
    if(oldDet) oldDet.classList.remove('open');
  }
  const card = document.querySelector(`.coin-card[data-id="${id}"]`);
  const det = document.getElementById(`det-${id}`);
  if(!det) return;
  if(det.classList.contains('open')){
    det.classList.remove('open');
    if(card) card.classList.remove('expanded');
    expandedItem=null;
  } else {
    det.classList.add('open');
    if(card) card.classList.add('expanded');
    expandedItem=id;
  }
}

// ---- DATA OPS ----
function saveAll(){ localStorage.setItem('my_assets_v2',JSON.stringify(watchlist)); localStorage.setItem('my_balances_v2',JSON.stringify(balances)); localStorage.setItem('my_coin_sources',JSON.stringify(coinSources)); localStorage.setItem('my_exchanges_v2',JSON.stringify(allExchanges)); }
function updateBal(s,src,type,v){ if(!balances[s])balances[s]={}; if(!balances[s][src]||typeof balances[s][src]!=='object')balances[s][src]={amount:0,staking:''}; balances[s][src][type]=v; saveAll(); updatePricesOnly(); }
function handleGlobalAdd(){ const inp=document.getElementById('global-add-input'); const v=inp.value.trim().toUpperCase(); if(!v)return; if(currentTab==='exchange'){if(!allExchanges.includes(v)){allExchanges.push(v);saveAll();inp.value='';renderList();}else showToast(`${v} sudah ada!`);}else{if(!watchlist.includes(v)){watchlist.push(v);coinSources[v]=[];saveAll();inp.value='';fetchAll();}else showToast(`${v} sudah ada!`);} }
function addCoinToExchange(ex){ const inp=document.getElementById(`add-coin-to-${ex}`); const s=inp.value.toUpperCase().trim(); if(s){if(!watchlist.includes(s)){watchlist.push(s);coinSources[s]=[];}if(!coinSources[s].includes(ex)){coinSources[s].push(ex);saveAll();inp.value='';renderList();fetchAll();}else showToast("Koin sudah ada!"); } }
function addCustomSource(s){ const inp=document.getElementById(`new-src-input-${s}`); const v=inp.value.trim().toUpperCase(); if(v){if(!coinSources[s].includes(v)){coinSources[s].push(v);if(!allExchanges.includes(v))allExchanges.push(v);saveAll();renderList();}else showToast("Source sudah ada!"); } }
function removeCoinFromExchange(s,ex){ coinSources[s]=coinSources[s].filter(i=>i!==ex); saveAll(); renderList(); }
function removeSource(s,src){ coinSources[s]=coinSources[s].filter(i=>i!==src); saveAll(); renderList(); }
function resetApp(){ localStorage.clear(); watchlist=[];balances={};coinSources={};allExchanges={};prices={};changes={}; renderList(); updatePricesOnly(); showToast("Data bersih!"); }
function openFilePicker(mode){ currentMode=mode; document.getElementById('importFile').value=''; document.getElementById('importFile').click(); }
function exportData(fn){ const data={assets:watchlist,balances,sources:coinSources,exchanges:allExchanges}; const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'})); a.download=`${fn.toUpperCase().trim()}.json`; a.click(); }
function handleFileSelect(e){ const f=e.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=(ev)=>{ try{ let d=JSON.parse(ev.target.result); if(currentMode==='restore'){watchlist=d.assets||[];balances=d.balances||{};coinSources=d.sources||{};allExchanges=d.exchanges||[];}else{(d.assets||[]).forEach(s=>{if(!watchlist.includes(s))watchlist.push(s);});(d.exchanges||[]).forEach(ex=>{if(!allExchanges.includes(ex))allExchanges.push(ex);});for(let s in d.sources){if(!coinSources[s])coinSources[s]=[];d.sources[s].forEach(src=>{if(!coinSources[s].includes(src))coinSources[s].push(src);});}for(let s in d.balances){if(!balances[s])balances[s]={};for(let src in d.balances[s])balances[s][src]=d.balances[s][src];}} migrateToUppercase();saveAll();fetchKurs();renderList();fetchAll();}catch(err){showToast("Gagal baca file!");} }; r.readAsText(f); }
function renameProcess(oldVal,newVal,type){ if(newVal&&newVal.trim()!==''&&newVal.toUpperCase()!==oldVal){ const u=newVal.toUpperCase().trim(); if(type==='exchange'){allExchanges=allExchanges.map(ex=>ex===oldVal?u:ex);for(let c in coinSources)coinSources[c]=coinSources[c].map(src=>src===oldVal?u:src);for(let c in balances){if(balances[c][oldVal]){balances[c][u]=balances[c][oldVal];delete balances[c][oldVal];}}}else{watchlist=watchlist.map(s=>s===oldVal?u:s);if(coinSources[oldVal]){coinSources[u]=coinSources[oldVal];delete coinSources[oldVal];}if(balances[oldVal]){balances[u]=balances[oldVal];delete balances[oldVal];}} saveAll();renderList(); } }
function exportToExcel(fn){ let csv="sep=,\nExchange,Koin,Amount,Staking,Harga USD,Total USD\n"; allExchanges.forEach(ex=>{ watchlist.forEach(s=>{ if(coinSources[s]?.includes(ex)){ const d=balances[s]?.[ex]; let am=(typeof d==='object')?parseFloat(d.amount||0):parseFloat(d||0); let st=(typeof d==='object')?parseFloat(d.staking||0):0; if(am+st>0)csv+=`${ex},${s},${am},${st},${prices[s]||0},${((am+st)*(prices[s]||0)).toFixed(2)}\n`; } }); }); const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download=`${fn.toUpperCase().trim()}.csv`; a.click(); showToast("Excel berhasil!"); }

// ---- HOLD GESTURE ----
function startHold(e,id,type){ const t=e.touches?e.touches[0]:e; startX=t.clientX;startY=t.clientY; holdTimer=setTimeout(()=>{ if(type==='exchange')confirmModal(`HAPUS / RENAME ${id}?`,'delete',()=>{allExchanges=allExchanges.filter(ex=>ex!==id);saveAll();renderList();},()=>renamePopup(id,'exchange')); else confirmModal(`HAPUS / RENAME ${id}?`,'delete',()=>{watchlist=watchlist.filter(s=>s!==id);delete balances[id];delete coinSources[id];saveAll();renderList();},()=>renamePopup(id,'coin')); },700); }
function moveHold(e){ if(!holdTimer)return; const t=e.touches?e.touches[0]:e; if(Math.abs(t.clientX-startX)>15||Math.abs(t.clientY-startY)>15)clearHold(); }
function clearHold(){ clearTimeout(holdTimer);holdTimer=null; }

// ---- TOAST ----
function showToast(m){ const el=document.getElementById('toast'); el.innerText=m; el.className='show'; setTimeout(()=>el.className='',3000); }

// ---- MODAL ----
function closeModal(){ document.getElementById('modal-overlay').classList.remove('active'); document.getElementById('modal-input').style.display='none'; }
function confirmModal(msg,type,onOk,onEdit=null){ const ov=document.getElementById('modal-overlay'); document.getElementById('modal-title').innerText=msg; let btns=''; if(type==='delete'){btns=`<button class="mbtn mbtn-del" id="mb-ok">HAPUS</button>`;if(onEdit)btns+=`<button class="mbtn mbtn-edit" id="mb-edit">EDIT</button>`;btns+=`<button class="mbtn mbtn-cancel" onclick="closeModal()">BATAL</button>`;}else{btns=`<button class="mbtn mbtn-ok" id="mb-ok">OKE</button><button class="mbtn mbtn-cancel" onclick="closeModal()">BATAL</button>`;} document.getElementById('modal-btns').innerHTML=btns; document.getElementById('mb-ok').onclick=()=>{closeModal();onOk();}; if(onEdit)document.getElementById('mb-edit').onclick=()=>{closeModal();onEdit();}; ov.classList.add('active'); }
function openBackupPopup(){ const now=new Date(); const ts=`PORTO_${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}${String(now.getSeconds()).padStart(2,'0')}`; const inp=document.getElementById('modal-input'); document.getElementById('modal-title').innerText='SIMPAN BACKUP'; inp.style.display='block'; inp.value=ts; document.getElementById('modal-btns').innerHTML=`<button class="mbtn mbtn-ok" id="mb-bk">OKE</button><button class="mbtn mbtn-cancel" onclick="closeModal()">BATAL</button>`; document.getElementById('mb-bk').onclick=()=>{exportData(inp.value);closeModal();}; document.getElementById('modal-overlay').classList.add('active'); setTimeout(()=>{inp.focus();let v=inp.value;inp.value='';inp.value=v;},250); }
function renamePopup(old,type){ const inp=document.getElementById('modal-input'); document.getElementById('modal-title').innerText='RENAME '+old; inp.style.display='block'; inp.value=old; document.getElementById('modal-btns').innerHTML=`<button class="mbtn mbtn-ok" id="mb-rn">SIMPAN</button><button class="mbtn mbtn-cancel" onclick="closeModal()">BATAL</button>`; document.getElementById('mb-rn').onclick=()=>{renameProcess(old,inp.value,type);closeModal();}; document.getElementById('modal-overlay').classList.add('active'); setTimeout(()=>{inp.focus();let v=inp.value;inp.value='';inp.value=v;},250); }
function openExcelPopup(){ const now=new Date(); const ts=`PORTO_${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}${String(now.getSeconds()).padStart(2,'0')}`; const inp=document.getElementById('modal-input'); document.getElementById('modal-title').innerText='EXPORT KE EXCEL (.CSV)'; inp.style.display='block'; inp.value=ts; document.getElementById('modal-btns').innerHTML=`<button class="mbtn mbtn-ok" id="mb-xl">OKE</button><button class="mbtn mbtn-cancel" onclick="closeModal()">BATAL</button>`; document.getElementById('mb-xl').onclick=()=>{exportToExcel(inp.value);closeModal();}; document.getElementById('modal-overlay').classList.add('active'); setTimeout(()=>inp.focus(),250); }
</script>
