<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0a0f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PORTO">
  <link rel="manifest" href="manifest.json">
  <title>PORTO</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #111118;
      --card: #16161f;
      --card2: #1a1a24;
      --border: rgba(255,255,255,0.07);
      --bh: rgba(255,255,255,0.13);
      --text: #f0eff8;
      --muted: #6b6a80;
      --accent: #7c6af7;
      --accent-glow: rgba(124,106,247,0.18);
      --accent-border: rgba(124,106,247,0.4);
      --green: #22d3a0;
      --red: #f05d6e;
      --mono: 'Space Mono', monospace;
      --sans: 'DM Sans', sans-serif;
      --sidebar-w: 280px;
    }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }

    /* ── LAYOUT ── */
    .app-shell {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* STICKY TOP BAR — dimasukkan ke dalam summary-wrap, tidak sticky sendiri */
    .top-bar {
      background: transparent;
      padding: 10px 16px 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      font-family: var(--mono);
      font-size: 15px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.12em;
      flex-shrink: 0;
    }
    .brand span { color: var(--accent); }

    .kurs-badge {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 4px 10px;
      white-space: nowrap;
    }

    /* STICKY BLOCK UTAMA — mencakup top-bar + summary + controls */
    .summary-wrap {
      position: sticky;
      top: 0;
      z-index: 200;
      background: rgba(10,10,15,0.97);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 0 0 0 0;
    }

    .summary-card {
      background: linear-gradient(135deg, #1a1829 0%, #12111c 50%, #0e1420 100%);
      border: 1px solid var(--accent-border);
      border-radius: 16px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 0 30px rgba(124,106,247,0.08), inset 0 1px 0 rgba(255,255,255,0.06);
      margin: 8px 16px 0;
    }

    .summary-left { flex: 1; min-width: 0; }
    .summary-label {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.14em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .summary-idr {
      font-family: var(--mono);
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .summary-usd {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      margin-top: 3px;
    }

    .summary-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      flex-shrink: 0;
    }
    .asset-count {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--accent);
      background: var(--accent-glow);
      border: 1px solid var(--accent-border);
      border-radius: 6px;
      padding: 3px 8px;
    }

    /* CONTROLS in sticky area */
    .controls-wrap {
      padding: 0 16px 10px;
      background: rgba(10,10,15,0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .tab-row {
      display: flex;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 8px;
      gap: 4px;
    }
    .tab-btn {
      flex: 1;
      padding: 8px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      font-family: var(--sans);
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: var(--accent);
      color: #fff;
    }

    .filter-row {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }
    .filter-input {
      flex: 1;
      width: 100%;
      min-width: 0;
      box-sizing: border-box;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 7px 12px;
      color: var(--text);
      font-family: var(--sans);
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }
    .filter-input:focus { border-color: var(--accent-border); }
    .filter-input::placeholder { color: var(--muted); }

    .sort-row {
      display: flex;
      gap: 6px;
    }
    .ctrl-select {
      flex: 1;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      font-family: var(--sans);
      font-size: 11px;
      padding: 6px 8px;
      outline: none;
      cursor: pointer;
      appearance: none;
    }

    /* MAIN LIST */
    #main-list {
      padding: 6px 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* ITEM ROW */
    .item-wrap {
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--card);
      transition: border-color 0.2s;
      animation: fadeUp 0.25s ease both;
    }
    .item-wrap:hover { border-color: var(--bh); }
    .item-wrap.expanded { border-color: var(--accent-border); }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .item-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 14px;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }

    .logo-wrap {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--surface);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }
    .logo-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .logo-initial {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 700;
      color: var(--accent);
    }

    .item-info { flex: 1; min-width: 0; }
    .item-name {
      font-weight: 600;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .item-sub {
      font-size: 11px;
      color: var(--muted);
      margin-top: 1px;
    }
    .change-badge {
      font-family: var(--mono);
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 5px;
      margin-left: 5px;
    }
    .change-badge.up { color: var(--green); background: rgba(34,211,160,0.1); }
    .change-badge.down { color: var(--red); background: rgba(240,93,110,0.1); }

    .item-val {
      text-align: right;
      flex-shrink: 0;
    }
    .item-val-main {
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 700;
    }
    .item-val-sub {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      margin-top: 2px;
    }

    /* EXPAND DETAIL */
    .item-detail {
      overflow: hidden;
      max-height: 0;
      transition: max-height 0.35s cubic-bezier(0.4,0,0.2,1), opacity 0.25s ease;
      opacity: 0;
      background: rgba(0,0,0,0.25);
      border-top: 0px solid var(--border);
    }
    .item-detail.open {
      max-height: 800px;
      opacity: 1;
      border-top-width: 1px;
    }

    .detail-inner { padding: 10px 14px 12px; }

    /* SOURCE ROW inside detail */
    .source-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .source-row:last-of-type { border-bottom: none; }

    .src-label {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 80px;
      flex-shrink: 0;
    }
    .src-label-logo {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--surface);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }
    .src-label-logo img { width: 100%; height: 100%; object-fit: cover; }
    .src-label-txt {
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 56px;
    }

    /* Mobile: source row jadi 2 baris - label di atas, input di bawah */
    @media (max-width: 699px) {
      .source-row {
        flex-wrap: wrap;
        gap: 5px;
      }
      .src-label {
        min-width: unset;
        flex: 1;
      }
      .src-label-txt {
        max-width: 100%;
        font-size: 11px;
      }
      .src-estimate {
        font-size: 10px;
        min-width: unset;
        flex: none;
      }
      .src-del { margin-left: auto; }
      .src-inputs {
        width: 100%;
        flex: none;
      }
      .src-input {
        flex: 1;
        width: unset;
        min-width: 0;
      }
    }

    /* Desktop: nama tidak terpotong, max-width lebih besar */
    @media (min-width: 700px) {
      .src-label-txt {
        max-width: 120px;
        font-size: 13px;
      }
      .src-label {
        min-width: 100px;
      }
      .src-inputs { gap: 8px; }
      .src-input { width: 100px; }
      .src-estimate { min-width: 75px; font-size: 11px; }
    }

    .src-inputs {
      display: flex;
      gap: 5px;
      flex: 1;
      justify-content: flex-end;
    }
    .src-input {
      width: 90px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 7px 8px;
      font-family: var(--mono);
      font-size: 12px;
      outline: none;
      text-align: right;
      transition: border-color 0.2s;
      /* DISABLE scroll wheel change on number inputs */
      -moz-appearance: textfield;
    }
    .src-input::-webkit-inner-spin-button,
    .src-input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    .src-input:focus { border-color: var(--accent-border); }
    .src-input::placeholder { color: var(--muted); font-size: 11px; }

    .src-estimate {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      text-align: right;
      min-width: 60px;
      flex-shrink: 0;
    }

    .src-del {
      color: var(--muted);
      font-size: 18px;
      cursor: pointer;
      padding: 0 4px;
      transition: color 0.2s;
      flex-shrink: 0;
    }
    .src-del:hover { color: var(--red); }

    .new-src-box {
      display: flex;
      gap: 6px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(255,255,255,0.05);
    }
    .new-src-input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 8px 10px;
      font-family: var(--sans);
      font-size: 12px;
      outline: none;
    }
    .new-src-btn {
      background: var(--accent-glow);
      border: 1px solid var(--accent-border);
      color: var(--accent);
      border-radius: 8px;
      padding: 0 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .new-src-btn:hover { background: rgba(124,106,247,0.3); }

    /* BOTTOM BAR */
    .bottom-bar {
      position: sticky;
      bottom: 0;
      z-index: 200;
      background: rgba(10,10,15,0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .add-row {
      display: flex;
      gap: 8px;
    }
    .add-input {
      flex: 1;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: var(--sans);
      font-size: 13px;
      padding: 10px 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .add-input:focus { border-color: var(--accent-border); }
    .add-input::placeholder { color: var(--muted); }
    .add-main-btn {
      background: var(--accent);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-family: var(--sans);
      font-weight: 700;
      font-size: 13px;
      padding: 0 18px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .add-main-btn:active { opacity: 0.8; }

    .backup-row {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      overflow: hidden;
      max-height: 120px;
      transition: max-height 0.3s ease, opacity 0.3s ease;
      opacity: 1;
    }
    .backup-row.hidden {
      max-height: 0;
      opacity: 0;
    }
    .bk-btn {
      flex: 1 1 calc(50% - 2.5px);
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      font-family: var(--sans);
      font-size: 11px;
      padding: 7px 6px;
      cursor: pointer;
      text-align: center;
      transition: border-color 0.2s, color 0.2s;
      white-space: nowrap;
    }
    .bk-btn:hover { border-color: var(--bh); color: var(--text); }
    .bk-btn-full { flex: 1 1 100% !important; border-color: var(--accent-border) !important; color: var(--accent) !important; }
    .bk-btn-danger { color: var(--red) !important; border-color: rgba(240,93,110,0.3) !important; }

    /* MODAL */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(6px);
      z-index: 3000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.active { display: flex; }
    .modal-box {
      width: 100%;
      max-width: 340px;
      background: var(--card2);
      border: 1px solid var(--accent-border);
      border-radius: 18px;
      padding: 22px 20px 18px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 40px rgba(124,106,247,0.1);
      transform: scale(0.92);
      transition: transform 0.22s cubic-bezier(0.34,1.56,0.64,1);
    }
    .modal-overlay.active .modal-box { transform: scale(1); }
    .modal-title {
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      text-align: center;
      margin-bottom: 14px;
    }
    .modal-input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--accent-border);
      color: var(--text);
      font-family: var(--mono);
      font-size: 14px;
      padding: 12px 14px;
      border-radius: 10px;
      outline: none;
      text-align: center;
      margin-bottom: 14px;
    }
    .modal-btns {
      display: flex;
      gap: 8px;
    }
    .modal-btn {
      flex: 1;
      padding: 11px 5px;
      border: none;
      border-radius: 10px;
      font-family: var(--sans);
      font-weight: 700;
      font-size: 12px;
      text-transform: uppercase;
      cursor: pointer;
      letter-spacing: 0.05em;
    }
    .mb-ok { background: var(--accent); color: #fff; }
    .mb-delete { background: rgba(240,93,110,0.2); border: 1px solid rgba(240,93,110,0.4); color: var(--red); }
    .mb-edit { background: rgba(255,255,255,0.06); border: 1px solid var(--border); color: var(--muted); }
    .mb-cancel { background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--muted); }

    /* TOAST */
    #toast {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(240,93,110,0.95);
      color: #fff;
      font-family: var(--sans);
      font-weight: 600;
      font-size: 12px;
      padding: 9px 20px;
      border-radius: 10px;
      z-index: 4000;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s;
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* DESKTOP / LANDSCAPE */
    @media (min-width: 700px) {
      :root { --sidebar-w: 340px; }

      .app-shell {
        flex-direction: row;
        min-height: 100vh;
      }

      /* Left sidebar */
      .sidebar {
        width: var(--sidebar-w);
        flex-shrink: 0;
        position: sticky;
        top: 0;
        height: 100vh;
        overflow-y: auto;
        background: var(--surface);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        padding: 24px 20px;
        gap: 16px;
      }
      .sidebar::-webkit-scrollbar { width: 4px; }
      .sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 4px; }

      .sidebar-brand {
        font-family: var(--mono);
        font-size: 18px;
        font-weight: 700;
        color: var(--accent);
        letter-spacing: 0.14em;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--border);
      }
      .sidebar-brand span { color: var(--accent); }

      .sidebar .summary-card {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
        padding: 18px 20px;
        margin: 0;
      }
      .sidebar .summary-card .summary-right {
        width: 100%;
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
      }
      .sidebar .summary-idr { font-size: 28px; }
      .sidebar .summary-usd { font-size: 13px; }
      .sidebar .summary-label { font-size: 10px; }

      .sidebar .kurs-badge { align-self: flex-end; }

      .sidebar .tab-row { margin-bottom: 0; }

      /* FIX: filter input lebar sesuai sidebar, tidak melar */
      .sidebar .filter-input {
        margin-bottom: 0;
        width: 100%;
        min-width: 0;
        max-width: 100%;
        box-sizing: border-box;
        flex: none;
        display: block;
      }

      .sidebar .sort-row { flex-direction: column; gap: 8px; }
      .sidebar .ctrl-select { font-size: 12px; padding: 8px 10px; }

      .sidebar .backup-area {
        margin-top: auto;
        padding-top: 16px;
        border-top: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .sidebar .add-row { flex-direction: column; gap: 8px; }
      .sidebar .add-main-btn { padding: 11px; font-size: 14px; }

      /* Hide mobile sticky elements */
      .top-bar { display: none; }
      .summary-wrap { display: none; }
      .bottom-bar { display: none; }

      /* Main content */
      .main-content {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
      }
      .main-content::-webkit-scrollbar { width: 5px; }
      .main-content::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.07); border-radius: 4px; }

      /* Desktop: nama item tidak terpotong */
      .item-name {
        white-space: normal;
        overflow: visible;
        text-overflow: unset;
      }

      #main-list {
        padding: 0;
        max-width: 900px;
        margin: 0 auto;
      }
    }

    @media (max-width: 699px) {
      .sidebar { display: none; }
      .main-content { width: 100%; }
    }

    /* EMPTY STATE */
    .empty-state {
      text-align: center;
      padding: 50px 20px;
      color: var(--muted);
    }
    .empty-state .empty-icon {
      font-size: 40px;
      margin-bottom: 12px;
    }
    .empty-state p {
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.08em;
    }
  </style>
</head>
<body>

<!-- MODAL -->
<div id="modal-overlay" class="modal-overlay" onclick="closeModal()">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div id="modal-title" class="modal-title"></div>
    <input type="text" id="modal-input" class="modal-input" style="display:none">

<script>
// ══════════════════════════════
//  MODAL
// ══════════════════════════════
function closeModal() {
  document.getElementById('modal-overlay').classList.remove('active');
  document.getElementById('modal-input').style.display = 'none';
}

function confirmModal(msg, type, onOk, onEdit = null) {
  const overlay = document.getElementById('modal-overlay');
  document.getElementById('modal-title').innerText = msg;
  const inp = document.getElementById('modal-input');
  inp.style.display = 'none';
  let btns = '';
  if (type === 'delete') {
    btns = `<button class="modal-btn mb-delete" id="btn-ok">HAPUS</button>`;
    if (onEdit) btns += `<button class="modal-btn mb-edit" id="btn-edit">EDIT</button>`;
    btns += `<button class="modal-btn mb-cancel" onclick="closeModal()">BATAL</button>`;
  } else {
    btns = `<button class="modal-btn mb-ok" id="btn-ok">OKE</button>`;
    btns += `<button class="modal-btn mb-cancel" onclick="closeModal()">BATAL</button>`;
  }
  document.getElementById('modal-btns').innerHTML = btns;
  document.getElementById('btn-ok').onclick = () => { closeModal(); onOk(); };
  if (onEdit) document.getElementById('btn-edit').onclick = () => { closeModal(); onEdit(); };
  overlay.classList.add('active');
}

function openBackupPopup() {
  const now = new Date();
  const ts = `PORTO_${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}`;
  const overlay = document.getElementById('modal-overlay');
  const inp = document.getElementById('modal-input');
  document.getElementById('modal-title').innerText = 'SIMPAN BACKUP';
  inp.style.display = 'block'; inp.value = ts;
  document.getElementById('modal-btns').innerHTML = `<button class="modal-btn mb-ok" id="btn-bk-ok">SIMPAN</button><button class="modal-btn mb-cancel" onclick="closeModal()">BATAL</button>`;
  document.getElementById('btn-bk-ok').onclick = () => { exportData(inp.value); closeModal(); };
  overlay.classList.add('active');
  setTimeout(() => { inp.focus(); const v = inp.value; inp.value = ''; inp.value = v; }, 200);
}

function renamePopup(oldVal, type) {
  const overlay = document.getElementById('modal-overlay');
  const inp = document.getElementById('modal-input');
  document.getElementById('modal-title').innerText = 'RENAME ' + oldVal;
  inp.style.display = 'block'; inp.value = oldVal;
  document.getElementById('modal-btns').innerHTML = `<button class="modal-btn mb-ok" id="btn-ren-ok">SIMPAN</button><button class="modal-btn mb-cancel" onclick="closeModal()">BATAL</button>`;
  document.getElementById('btn-ren-ok').onclick = () => { renameProcess(oldVal, inp.value, type); closeModal(); };
  overlay.classList.add('active');
  setTimeout(() => { inp.focus(); const v = inp.value; inp.value = ''; inp.value = v; }, 200);
}

function openExcelPopup() {
  const now = new Date();
  const ts = `PORTO_${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}`;
  const overlay = document.getElementById('modal-overlay');
  const inp = document.getElementById('modal-input');
  document.getElementById('modal-title').innerText = 'EXPORT KE CSV';
  inp.style.display = 'block'; inp.value = ts;
  document.getElementById('modal-btns').innerHTML = `<button class="modal-btn mb-ok" id="btn-xl-ok">EXPORT</button><button class="modal-btn mb-cancel" onclick="closeModal()">BATAL</button>`;
  document.getElementById('btn-xl-ok').onclick = () => { exportToExcel(inp.value); closeModal(); };
  overlay.classList.add('active');
  setTimeout(() => { inp.focus(); }, 200);
}

// ══════════════════════════════
//  SCROLL — hide backup on scroll down
// ══════════════════════════════
let lastScrollY = 0;
window.addEventListener('scroll', () => {
  const cur = window.scrollY;
  const br = document.getElementById('backup-row');
  if (!br) return;
  if (cur > lastScrollY && cur > 40) br.classList.add('hidden');
  else if (cur < lastScrollY) br.classList.remove('hidden');
  lastScrollY = cur;
}, { passive: true });

// ══════════════════════════════
//  LOGO FALLBACK
// ══════════════════════════════
function handleLogoError(img, sym) {
  if (sym === 'IDR') { img.parentElement.innerHTML = `<div class="logo-initial" style="color:#22d3a0">RP</div>`; return; }
  const retry = parseInt(img.getAttribute('data-retry') || '0');
  const s = sym.toLowerCase();
  const sources = [
    `https://gate.io/images/coin_icon/64/${s}.png`,
    `https://assets.coincap.io/assets/icons/${s}@2x.png`,
    `https://static.okx.com/cdn/oksupport/asset/currency/icon/${s}.png`
  ];
  if (retry < sources.length) { img.setAttribute('data-retry', retry + 1); img.src = sources[retry]; }
  else { img.parentElement.innerHTML = `<div class="logo-initial">${sym.substring(0,2)}</div>`; }
}

// ══════════════════════════════
//  DATA & STATE
// ══════════════════════════════
let usdToIdr = 16000;
let prices = {}, changes = {}, coinMapCG = {};
let currentTab = 'exchange';
let isFetching = false;
let watchlist = JSON.parse(localStorage.getItem('my_assets_v2') || '[]');
let balances = JSON.parse(localStorage.getItem('my_balances_v2') || '{}');
let coinSources = JSON.parse(localStorage.getItem('my_coin_sources') || '{}');
let allExchanges = JSON.parse(localStorage.getItem('my_exchanges_v2') || '[]');
let expandedItem = null;
let currentMode = 'restore';
let holdTimer, startX, startY;

const exchangeLogos = {
  "BINANCE": "https://assets.coingecko.com/markets/images/52/standard/binance.jpg?1706864274",
  "BYBIT": "https://assets.coingecko.com/markets/images/698/standard/bybit_spot.png?1706864649",

  "WALLET": "https://assets.coincap.io/assets/icons/twt@2x.png"
};

window.onload = () => {
  migrateToUppercase();
  const savedSort = localStorage.getItem('last_sort') || 'manual';
  const savedCur = localStorage.getItem('last_cur') || 'IDR';
  ['sort-order','sort-order-desk'].forEach(id => { const el = document.getElementById(id); if(el) el.value = savedSort; });
  ['currency-view','currency-view-desk'].forEach(id => { const el = document.getElementById(id); if(el) el.value = savedCur; });
  renderList();
  fetchKurs();
  fetchCoinMap();
  fetchAll();
  setInterval(fetchAll, 60000);
};

function migrateToUppercase() {
  let dirty = false;
  watchlist = watchlist.map(s => { if(s !== s.toUpperCase()) dirty = true; return s.toUpperCase(); });
  allExchanges = allExchanges.map(ex => { if(ex !== ex.toUpperCase()) dirty = true; return ex.toUpperCase(); });
  let newCS = {}, newBal = {};
  for (let c in coinSources) {
    let uc = c.toUpperCase(); if(c !== uc) dirty = true;
    newCS[uc] = (coinSources[c] || []).map(s => { if(s !== s.toUpperCase()) dirty = true; return s.toUpperCase(); });
  }
  for (let c in balances) {
    let uc = c.toUpperCase(); newBal[uc] = {};
    for (let s in balances[c]) {
      let us = s.toUpperCase();
      newBal[uc][us] = (typeof balances[c][s] === 'object') ? balances[c][s] : { amount: balances[c][s], staking: '' };
    }
  }
  coinSources = newCS; balances = newBal;
  if(dirty) saveAll();
}

// ══════════════════════════════
//  FETCH
// ══════════════════════════════
async function fetchKurs() {
  try {
    const r = await fetch('https://api.binance.com/api/v3/ticker/price?symbol=USDTIDR');
    const d = await r.json();
    if(d.price) {
      usdToIdr = parseFloat(d.price);
      const txt = `USD/IDR: ${Math.round(usdToIdr).toLocaleString('id-ID')}`;
      ['kurs-live','kurs-live-desk'].forEach(id => { const el = document.getElementById(id); if(el) el.innerText = txt; });
      updatePricesOnly();
    }
  } catch(e) {}
}

async function fetchCoinMap() {
  try {
    const r = await fetch('https://api.coingecko.com/api/v3/coins/list');
    (await r.json()).forEach(c => { coinMapCG[c.symbol.toUpperCase()] = c.id; });
  } catch(e) {}
}

async function fetchAll() {
  if(isFetching) return; isFetching = true;
  let rem = watchlist.filter(s => !['IDR','USDT','USDC','USD','BUSD'].includes(s));
  try {
    const res = await fetch('https://api.bybit.com/v5/market/tickers?category=spot');
    const data = await res.json();
    if(data.result?.list) {
      data.result.list.forEach(item => {
        let sym = item.symbol.replace('USDT','');
        if(rem.includes(sym)) { prices[sym] = parseFloat(item.lastPrice); changes[sym] = (parseFloat(item.price24hPcnt)*100).toFixed(2); rem = rem.filter(c => c !== sym); }
      });
    }
  } catch(e) {}
  if(rem.length > 0) {
    try {
      const res = await fetch('https://api.binance.com/api/v3/ticker/24hr');
      const data = await res.json();
      data.forEach(item => {
        let sym = item.symbol.replace('USDT','');
        if(rem.includes(sym)) { prices[sym] = parseFloat(item.lastPrice); changes[sym] = parseFloat(item.priceChangePercent).toFixed(2); rem = rem.filter(c => c !== sym); }
      });
    } catch(e) {}
  }
  for (const s of rem) {
    if(coinMapCG[s]) {
      try {
        const r = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${coinMapCG[s]}&vs_currencies=usd&include_24hr_change=true`);
        const d = await r.json();
        if(d[coinMapCG[s]]) { prices[s] = d[coinMapCG[s]].usd; changes[s] = d[coinMapCG[s]].usd_24h_change ? d[coinMapCG[s]].usd_24h_change.toFixed(2) : '0.00'; }
      } catch(e) {}
    }
  }
  watchlist.forEach(s => {
    if(s === 'IDR') { prices[s] = 1/usdToIdr; changes[s] = '0.00'; }
    else if(['USDT','USDC','USD','BUSD'].includes(s)) { prices[s] = 1; changes[s] = '0.00'; }
    else if(!prices[s]) { prices[s] = 0; changes[s] = '0.00'; }
  });
  updatePricesOnly();
  isFetching = false;
}

// ══════════════════════════════
//  HELPERS
// ══════════════════════════════
function getSortType() {
  const isDesktop = window.innerWidth >= 700;
  return document.getElementById(isDesktop ? 'sort-order-desk' : 'sort-order')?.value || 'manual';
}
function getCurrencyView() {
  const isDesktop = window.innerWidth >= 700;
  return document.getElementById(isDesktop ? 'currency-view-desk' : 'currency-view')?.value || 'IDR';
}
function getFilterQuery() {
  const isDesktop = window.innerWidth >= 700;
  return (document.getElementById(isDesktop ? 'filter-desk' : 'filter-input')?.value || '').toUpperCase();
}

function getCoinTotal(sym) {
  let t = 0;
  (coinSources[sym] || []).forEach(src => {
    const d = balances[sym]?.[src];
    t += (typeof d === 'object') ? (parseFloat(d.amount||0) + parseFloat(d.staking||0)) : parseFloat(d||0);
  });
  return t;
}

function fmtUSD(v) {
  if(v >= 1000000) return `$${(v/1000000).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}M`;
  if(v >= 1000) return `$${v.toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:0})}`;
  return `$${v.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}`;
}

function fmtIDR(v) {
  return `Rp ${Math.round(v).toLocaleString('id-ID')}`;
}

function saveAll() {
  localStorage.setItem('my_assets_v2', JSON.stringify(watchlist));
  localStorage.setItem('my_balances_v2', JSON.stringify(balances));
  localStorage.setItem('my_coin_sources', JSON.stringify(coinSources));
  localStorage.setItem('my_exchanges_v2', JSON.stringify(allExchanges));
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.innerText = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

// ══════════════════════════════
//  UPDATE PRICES (no re-render)
// ══════════════════════════════
function updatePricesOnly() {
  const cur = getCurrencyView();
  let totalUsd = 0;

  if(currentTab === 'exchange') {
    allExchanges.forEach(ex => {
      let exUsd = 0;
      watchlist.forEach(sym => {
        if(coinSources[sym]?.includes(ex)) {
          const d = balances[sym]?.[ex];
          let b = (typeof d === 'object') ? (parseFloat(d.amount||0)+parseFloat(d.staking||0)) : parseFloat(d||0);
          exUsd += b * (prices[sym]||0);
        }
      });
      totalUsd += exUsd;
      const el = document.getElementById(`val-ex-${ex}`);
      if(el) el.innerText = cur === 'IDR' ? fmtIDR(exUsd*usdToIdr) : fmtUSD(exUsd);

      // update per-coin estimates inside expand
      watchlist.forEach(sym => {
        if(coinSources[sym]?.includes(ex)) {
          const est = document.getElementById(`est-${ex}-${sym}`);
          if(est) {
            const d = balances[sym]?.[ex];
            const amt = (typeof d === 'object') ? (parseFloat(d.amount||0)+parseFloat(d.staking||0)) : parseFloat(d||0);
            const usdVal = amt * (prices[sym]||0);
            est.innerText = amt > 0 ? `~${fmtUSD(usdVal)}` : '';
          }
        }
      });
    });
  } else {
    watchlist.forEach(sym => {
      const valUsd = getCoinTotal(sym) * (prices[sym]||0);
      totalUsd += valUsd;
      const elVal = document.getElementById(`val-coin-${sym}`);
      const elPrice = document.getElementById(`price-coin-${sym}`);
      const elChange = document.getElementById(`change-coin-${sym}`);
      if(elVal) elVal.innerText = cur === 'IDR' ? fmtIDR(valUsd*usdToIdr) : fmtUSD(valUsd);
      if(elPrice) elPrice.innerText = sym === 'IDR' ? 'Stable IDR' : '$'+(prices[sym]||0).toLocaleString(undefined,{minimumFractionDigits:(prices[sym]||0)<1?4:2});
      if(elChange) {
        const c = changes[sym] || '0.00';
        elChange.innerText = `${parseFloat(c)>=0?'+':''}${c}%`;
        elChange.className = `change-badge ${parseFloat(c)>=0?'up':'down'}`;
      }
      // per-source estimates in coin tab
      (coinSources[sym]||[]).forEach(src => {
        const est = document.getElementById(`est-coin-${sym}-${src}`);
        if(est) {
          const d = balances[sym]?.[src];
          const amt = (typeof d === 'object') ? (parseFloat(d.amount||0)+parseFloat(d.staking||0)) : parseFloat(d||0);
          const usdVal = amt * (prices[sym]||0);
          est.innerText = amt > 0 ? `~${fmtUSD(usdVal)}` : '';
        }
      });
    });
  }

  const idrTotal = fmtIDR(totalUsd * usdToIdr);
  const usdTotal = fmtUSD(totalUsd);
  ['total-all-idr','total-idr-desk'].forEach(id => { const el = document.getElementById(id); if(el) el.innerText = idrTotal; });
  ['total-all-usd','total-usd-desk'].forEach(id => { const el = document.getElementById(id); if(el) el.innerText = usdTotal; });

  // asset count badge
  const cnt = currentTab === 'exchange' ? allExchanges.length : watchlist.length;
  const label = currentTab === 'exchange' ? 'exchange' : 'aset';
  ['asset-count-badge', 'asset-count-badge-desk'].forEach(id => {
    const el = document.getElementById(id);
    if(el) el.innerText = `${cnt} ${label}`;
  });
}

// ══════════════════════════════
//  EXPAND / COLLAPSE (smooth)
// ══════════════════════════════
function toggleDetail(id) {
  const target = document.getElementById(`det-${id}`);
  if(!target) return;

  // close previous
  if(expandedItem && expandedItem !== id) {
    const old = document.getElementById(`det-${expandedItem}`);
    if(old) { old.classList.remove('open'); document.getElementById(`wrap-${expandedItem}`)?.classList.remove('expanded'); }
  }

  const wrap = document.getElementById(`wrap-${id}`);
  if(target.classList.contains('open')) {
    target.classList.remove('open');
    wrap?.classList.remove('expanded');
    expandedItem = null;
  } else {
    target.classList.add('open');
    wrap?.classList.add('expanded');
    expandedItem = id;
    // update estimates right away
    setTimeout(updatePricesOnly, 50);
  }
}

// ══════════════════════════════
//  RENDER LIST
// ══════════════════════════════
function renderList() {
  const list = document.getElementById('main-list');
  const query = getFilterQuery();
  const sortType = getSortType();
  let html = '';

  if(currentTab === 'exchange') {
    let exArr = allExchanges.map(ex => {
      let t = 0;
      watchlist.forEach(s => {
        if(coinSources[s]?.includes(ex)) {
          const d = balances[s]?.[ex];
          let b = (typeof d === 'object') ? (parseFloat(d.amount||0)+parseFloat(d.staking||0)) : parseFloat(d||0);
          t += b * (prices[s]||0);
        }
      });
      return { name: ex, totalValue: t };
    }).filter(ex => ex.name.includes(query));

    if(sortType === 'name') exArr.sort((a,b) => a.name.localeCompare(b.name));
    else if(sortType === 'value' || sortType === 'gainers') exArr.sort((a,b) => b.totalValue - a.totalValue);

    if(exArr.length === 0) {
      html = `<div class="empty-state"><div class="empty-icon">📭</div><p>Belum ada exchange.<br>Tambah di bawah.</p></div>`;
    }

    exArr.forEach(ex => {
      const brand = ex.name.split(' ')[0];
      const suffix = ex.name.split(' ').slice(1).join(' ');
      const logo = exchangeLogos[brand] || '';
      let subKoin = watchlist.filter(s => coinSources[s]?.includes(ex.name));

      if(sortType === 'name') subKoin.sort((a,b) => a.localeCompare(b));
      else if(sortType === 'value') subKoin.sort((a,b) => (getCoinTotal(b)*(prices[b]||0)) - (getCoinTotal(a)*(prices[a]||0)));
      else if(sortType === 'gainers') subKoin.sort((a,b) => parseFloat(changes[b]||-999) - parseFloat(changes[a]||-999));

      const isOpen = expandedItem === ex.name;

      const coinRows = subKoin.map(s => {
        const d = (balances[s] && balances[s][ex.name]) ? balances[s][ex.name] : { amount: '', staking: '' };
        const amt = (typeof d === 'object') ? parseFloat(d.amount||0) : parseFloat(d||0);
        const stk = (typeof d === 'object') ? parseFloat(d.staking||0) : 0;
        const usdEst = (amt + stk) * (prices[s]||0);
        const estStr = (amt + stk) > 0 ? `~${fmtUSD(usdEst)}` : '';
        return `
          <div class="source-row">
            <div class="src-label">
              <div class="src-label-logo"><img src="any" onerror="handleLogoError(this,'${s}')"></div>
              <span class="src-label-txt">${s}</span>
            </div>
            <div class="src-inputs">
              <input type="number" class="src-input" inputmode="decimal"
                value="${d.amount||''}"
                oninput="updateBal('${s}','${ex.name}','amount',this.value)"
                placeholder="Amount">
              <input type="number" class="src-input" inputmode="decimal"
                value="${d.staking||''}"
                oninput="updateBal('${s}','${ex.name}','staking',this.value)"
                placeholder="Stake">
            </div>
            <span class="src-estimate" id="est-${ex.name}-${s}">${estStr}</span>
            <span class="src-del" onclick="confirmModal('Hapus ${s}?','delete',()=>removeCoinFromExchange('${s}','${ex.name}'))">×</span>
          </div>`;
      }).join('');

      html += `
        <div class="item-wrap${isOpen?' expanded':''}" id="wrap-${ex.name}">
          <div class="item-card"
            onclick="toggleDetail('${ex.name}')"
            onmousedown="startHold(event,'${ex.name}','exchange')"
            onmousemove="moveHold(event)" onmouseup="clearHold()"
            ontouchstart="startHold(event,'${ex.name}','exchange')"
            ontouchmove="moveHold(event)" ontouchend="clearHold()">
            <div class="logo-wrap">
              ${logo ? `<img src="${logo}" onerror="this.parentElement.innerHTML='<div class=\\'logo-initial\\'>${brand.substring(0,2)}</div>'">` : `<div class="logo-initial">${brand.substring(0,2)}</div>`}
            </div>
            <div class="item-info">
              <div class="item-name">${brand}${suffix ? `<span style="font-size:11px;font-weight:400;color:var(--muted)"> ${suffix}</span>` : ''}</div>
              <div class="item-sub">${subKoin.length} koin</div>
            </div>
            <div class="item-val">
              <div class="item-val-main" id="val-ex-${ex.name}">-</div>
            </div>
          </div>
          <div class="item-detail${isOpen?' open':''}" id="det-${ex.name}">
            <div class="detail-inner">
              ${coinRows}
              <div class="new-src-box">
                <input type="text" id="add-coin-to-${ex.name}" class="new-src-input" placeholder="Tambah Coin ke ${brand}..." onkeypress="if(event.key==='Enter') addCoinToExchange('${ex.name}')">
                <button class="new-src-btn" onclick="addCoinToExchange('${ex.name}')">+</button>
              </div>
            </div>
          </div>
        </div>`;
    });

  } else {
    let filtered = watchlist.filter(s => s.includes(query));
    if(sortType === 'name') filtered.sort((a,b) => a.localeCompare(b));
    else if(sortType === 'value') filtered.sort((a,b) => (getCoinTotal(b)*(prices[b]||0)) - (getCoinTotal(a)*(prices[a]||0)));
    else if(sortType === 'gainers') filtered.sort((a,b) => parseFloat(changes[b]||-999) - parseFloat(changes[a]||-999));

    if(filtered.length === 0) {
      html = `<div class="empty-state"><div class="empty-icon">🪙</div><p>Belum ada koin.<br>Tambah di bawah.</p></div>`;
    }

    filtered.forEach(s => {
      const subSrc = [...(coinSources[s]||[])];
      const isOpen = expandedItem === s;
      const p = prices[s] || 0;
      const c = changes[s] || '0.00';

      const srcRows = subSrc.map(src => {
        const d = (balances[s] && balances[s][src]) ? balances[s][src] : { amount: '', staking: '' };
        const amt = (typeof d === 'object') ? parseFloat(d.amount||0) : parseFloat(d||0);
        const stk = (typeof d === 'object') ? parseFloat(d.staking||0) : 0;
        const usdEst = (amt + stk) * p;
        const estStr = (amt + stk) > 0 ? `~${fmtUSD(usdEst)}` : '';
        const srcPrefix = src.split(' ')[0];
        const srcLogo = exchangeLogos[srcPrefix] || exchangeLogos[src] || '';
        return `
          <div class="source-row">
            <div class="src-label">
              <div class="src-label-logo">
                ${srcLogo ? `<img src="${srcLogo}" onerror="this.parentElement.innerHTML='<div class=\\'logo-initial\\'>${srcPrefix.substring(0,2)}</div>'">` : `<div class="logo-initial" style="font-size:8px">${srcPrefix.substring(0,2)}</div>`}
              </div>
              <span class="src-label-txt">${src}</span>
            </div>
            <div class="src-inputs">
              <input type="number" class="src-input" inputmode="decimal"
                value="${d.amount||''}"
                oninput="updateBal('${s}','${src}','amount',this.value)"
                placeholder="Amount">
              <input type="number" class="src-input" inputmode="decimal"
                value="${d.staking||''}"
                oninput="updateBal('${s}','${src}','staking',this.value)"
                placeholder="Stake">
            </div>
            <span class="src-estimate" id="est-coin-${s}-${src}">${estStr}</span>
            <span class="src-del" onclick="confirmModal('Hapus ${src}?','delete',()=>removeSource('${s}','${src}'))">×</span>
          </div>`;
      }).join('');

      html += `
        <div class="item-wrap${isOpen?' expanded':''}" id="wrap-${s}">
          <div class="item-card"
            onclick="toggleDetail('${s}')"
            onmousedown="startHold(event,'${s}','coin')"
            onmousemove="moveHold(event)" onmouseup="clearHold()"
            ontouchstart="startHold(event,'${s}','coin')"
            ontouchmove="moveHold(event)" ontouchend="clearHold()">
            <div class="logo-wrap">
              <img src="any" onerror="handleLogoError(this,'${s}')">
            </div>
            <div class="item-info">
              <div class="item-name">${s}<span id="change-coin-${s}" class="change-badge ${parseFloat(c)>=0?'up':'down'}">${parseFloat(c)>=0?'+':''}${c}%</span></div>
              <div class="item-sub" id="price-coin-${s}">${p ? '$'+p.toLocaleString(undefined,{minimumFractionDigits:p<1?4:2}) : '...'}</div>
            </div>
            <div class="item-val">
              <div class="item-val-main" style="font-size:12px">${getCoinTotal(s).toLocaleString()}</div>
              <div class="item-val-sub" id="val-coin-${s}">-</div>
            </div>
          </div>
          <div class="item-detail${isOpen?' open':''}" id="det-${s}">
            <div class="detail-inner">
              ${srcRows}
              <div class="new-src-box">
                <input type="text" id="new-src-input-${s}" class="new-src-input" placeholder="Source Baru..." onkeypress="if(event.key==='Enter') addCustomSource('${s}')">
                <button class="new-src-btn" onclick="addCustomSource('${s}')">+</button>
              </div>
            </div>
          </div>
        </div>`;
    });
  }

  list.innerHTML = html;
  updatePricesOnly();

  // Disable scroll-wheel on all number inputs
  list.querySelectorAll('input[type=number]').forEach(inp => {
    inp.addEventListener('wheel', e => e.preventDefault(), { passive: false });
  });
}

// ══════════════════════════════
//  ACTIONS
// ══════════════════════════════
function switchTab(tab) {
  currentTab = tab;
  ['tab-ex','tab-ex-d'].forEach(id => { const el = document.getElementById(id); if(el) el.classList.toggle('active', tab==='exchange'); });
  ['tab-coin','tab-coin-d'].forEach(id => { const el = document.getElementById(id); if(el) el.classList.toggle('active', tab==='coin'); });
  expandedItem = null;
  renderList();
}

function updateSettings(src) {
  if(src === 'mob') {
    const sortVal = document.getElementById('sort-order')?.value;
    const curVal = document.getElementById('currency-view')?.value;
    if(sortVal) { localStorage.setItem('last_sort', sortVal); const d = document.getElementById('sort-order-desk'); if(d) d.value = sortVal; }
    if(curVal) { localStorage.setItem('last_cur', curVal); const d = document.getElementById('currency-view-desk'); if(d) d.value = curVal; }
  } else {
    const sortVal = document.getElementById('sort-order-desk')?.value;
    const curVal = document.getElementById('currency-view-desk')?.value;
    if(sortVal) { localStorage.setItem('last_sort', sortVal); const d = document.getElementById('sort-order'); if(d) d.value = sortVal; }
    if(curVal) { localStorage.setItem('last_cur', curVal); const d = document.getElementById('currency-view'); if(d) d.value = curVal; }
  }
  renderList();
}

function handleGlobalAdd() {
  const isDesktop = window.innerWidth >= 700;
  const input = document.getElementById(isDesktop ? 'add-input-desk' : 'global-add-input');
  const v = input.value.trim().toUpperCase();
  if(!v) return;
  if(currentTab === 'exchange') {
    if(!allExchanges.includes(v)) { allExchanges.push(v); saveAll(); input.value = ''; renderList(); }
    else showToast(`Exchange ${v} sudah ada!`);
  } else {
    if(!watchlist.includes(v)) { watchlist.push(v); coinSources[v] = []; saveAll(); input.value = ''; fetchAll(); }
    else showToast(`Koin ${v} sudah ada!`);
  }
}

function updateBal(s, src, type, v) {
  if(!balances[s]) balances[s] = {};
  if(!balances[s][src] || typeof balances[s][src] !== 'object') balances[s][src] = { amount: 0, staking: '' };
  balances[s][src][type] = v;
  saveAll();
  updatePricesOnly();
}

function addCoinToExchange(ex) {
  const input = document.getElementById(`add-coin-to-${ex}`);
  const s = input.value.toUpperCase().trim();
  if(s) {
    if(!watchlist.includes(s)) { watchlist.push(s); coinSources[s] = []; }
    if(!coinSources[s].includes(ex)) { coinSources[s].push(ex); saveAll(); input.value = ''; renderList(); fetchAll(); }
    else showToast('Koin sudah ada!');
  }
}

function addCustomSource(s) {
  const input = document.getElementById(`new-src-input-${s}`);
  const v = input.value.trim().toUpperCase();
  if(v) {
    if(!coinSources[s].includes(v)) {
      coinSources[s].push(v);
      if(!allExchanges.includes(v)) allExchanges.push(v);
      saveAll(); renderList();
    } else showToast('Source sudah ada!');
  }
}

function removeCoinFromExchange(s, ex) { coinSources[s] = coinSources[s].filter(i => i !== ex); saveAll(); renderList(); }
function removeSource(s, src) { coinSources[s] = coinSources[s].filter(i => i !== src); saveAll(); renderList(); }

function resetApp() {
  localStorage.clear(); watchlist = []; balances = {}; coinSources = {}; allExchanges = []; prices = {}; changes = {};
  expandedItem = null; renderList(); updatePricesOnly(); showToast('Data direset!');
}

function openFilePicker(mode) { currentMode = mode; document.getElementById('importFile').value = ''; document.getElementById('importFile').click(); }

function exportData(fileName) {
  const data = { assets: watchlist, balances: balances, sources: coinSources, exchanges: allExchanges };
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data)], { type: 'application/json' }));
  a.download = `${fileName.toUpperCase().trim()}.json`;
  a.click();
}

function handleFileSelect(event) {
  const file = event.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = (f) => {
    try {
      let d = JSON.parse(f.target.result);
      if(currentMode === 'restore') {
        watchlist = d.assets || []; balances = d.balances || {}; coinSources = d.sources || {}; allExchanges = d.exchanges || [];
      } else {
        (d.assets || []).forEach(s => { if(!watchlist.includes(s)) watchlist.push(s); });
        (d.exchanges || []).forEach(ex => { if(!allExchanges.includes(ex)) allExchanges.push(ex); });
        for(let s in d.sources) { if(!coinSources[s]) coinSources[s]=[]; d.sources[s].forEach(src => { if(!coinSources[s].includes(src)) coinSources[s].push(src); }); }
        for(let s in d.balances) { if(!balances[s]) balances[s]={}; for(let src in d.balances[s]) { balances[s][src] = d.balances[s][src]; } }
      }
      migrateToUppercase(); saveAll(); fetchKurs(); renderList(); updatePricesOnly(); fetchAll();
      showToast('Berhasil!');
    } catch(err) { showToast('Gagal import!'); }
  };
  reader.readAsText(file);
}

function exportToExcel(fileName) {
  let csv = 'sep=,\nExchange,Koin,Amount,Staking,Harga USD,Total USD\n';
  allExchanges.forEach(ex => {
    watchlist.forEach(s => {
      if(coinSources[s]?.includes(ex)) {
        const d = balances[s]?.[ex];
        let am = (typeof d === 'object') ? parseFloat(d.amount||0) : parseFloat(d||0);
        let st = (typeof d === 'object') ? parseFloat(d.staking||0) : 0;
        if(am+st > 0) csv += `${ex},${s},${am},${st},${prices[s]||0},${((am+st)*(prices[s]||0)).toFixed(2)}\n`;
      }
    });
  });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = `${fileName.toUpperCase().trim()}.csv`;
  a.click();
  showToast('CSV Berhasil Disimpan!');
}

function renameProcess(oldVal, newVal, type) {
  if(newVal && newVal.trim() !== '' && newVal.toUpperCase() !== oldVal) {
    const upper = newVal.toUpperCase().trim();
    if(type === 'exchange') {
      allExchanges = allExchanges.map(ex => ex === oldVal ? upper : ex);
      for(let c in coinSources) coinSources[c] = coinSources[c].map(src => src === oldVal ? upper : src);
      for(let c in balances) { if(balances[c][oldVal]) { balances[c][upper] = balances[c][oldVal]; delete balances[c][oldVal]; } }
    } else {
      watchlist = watchlist.map(s => s === oldVal ? upper : s);
      if(coinSources[oldVal]) { coinSources[upper] = coinSources[oldVal]; delete coinSources[oldVal]; }
      if(balances[oldVal]) { balances[upper] = balances[oldVal]; delete balances[oldVal]; }
    }
    saveAll(); renderList();
  }
}

// HOLD (long press)
function startHold(event, id, type) {
  const touch = event.touches ? event.touches[0] : event;
  startX = touch.clientX; startY = touch.clientY;
  holdTimer = setTimeout(() => {
    if(type === 'exchange') confirmModal(`HAPUS ${id}?`, 'delete', () => { allExchanges = allExchanges.filter(ex => ex !== id); saveAll(); renderList(); }, () => renamePopup(id, 'exchange'));
    else confirmModal(`HAPUS ${id}?`, 'delete', () => { watchlist = watchlist.filter(s => s !== id); delete balances[id]; delete coinSources[id]; saveAll(); renderList(); }, () => renamePopup(id, 'coin'));
  }, 700);
}
function moveHold(event) { if(!holdTimer) return; const touch = event.touches ? event.touches[0] : event; if(Math.abs(touch.clientX-startX)>15 || Math.abs(touch.clientY-startY)>15) clearHold(); }
function clearHold() { clearTimeout(holdTimer); holdTimer = null; }
</script>
</body>
</html>
